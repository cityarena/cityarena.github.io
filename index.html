<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Arena</title>
<style>/* City Arena — premium dark.
   Layered graphite surfaces, warm ivory type. Jade marks what is live or settled, champagne marks credit and the brand,
   amber and red are kept for caution. Depth comes from layering, hairlines, a top-edge highlight and soft shadow.
   Motion is short (about 170 ms) and never loops, except the saving spinner and the loading shimmer. */
:root {
  --bg: #0a0b0d;
  --bg-2: #0e1013;
  --inset: #0c0d10;
  --surface: #131519;
  --raised: #1a1d22;
  --hover: #22262c;
  --line: rgba(255, 255, 255, 0.07);
  --line-strong: rgba(255, 255, 255, 0.12);
  --line-bold: rgba(255, 255, 255, 0.2);
  --ink: #f3f0e9;
  /* The green of the City Arena logo: the brand's own accent, used sparingly beside it. */
  --brand-green: #5cb947;
  --brand-green-top: #2f8a2c;
  --brand-green-deep: #226a21;
  --brand-green-edge: #3c9a38;
  --brand-green-soft: rgba(92, 185, 71, 0.12);
  --brand-green-line: rgba(92, 185, 71, 0.4);
  --ink-2: #aeaaa1;
  --ink-3: #89857d;
  --accent: #4bbd94;
  --accent-strong: #1f7a5c;
  --accent-deep: #19674e;
  --accent-soft: rgba(75, 189, 148, 0.1);
  --accent-line: rgba(75, 189, 148, 0.34);
  --on-accent: #f8f5ef;
  --gold: #d0b279;
  --gold-soft: rgba(208, 178, 121, 0.1);
  --gold-line: rgba(208, 178, 121, 0.34);
  --warn: #e0ab55;
  --warn-soft: rgba(224, 171, 85, 0.1);
  --warn-line: rgba(224, 171, 85, 0.38);
  --danger: #e57b79;
  --danger-soft: rgba(229, 123, 121, 0.1);
  --danger-line: rgba(229, 123, 121, 0.38);
  --card: linear-gradient(180deg, #171a1f 0%, #121418 100%);
  --hi: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 28px -18px rgba(0, 0, 0, 0.8);
  --shadow-pop: 0 2px 6px rgba(0, 0, 0, 0.4), 0 24px 56px -16px rgba(0, 0, 0, 0.85);
  --r-lg: 16px;
  --r: 12px;
  --r-sm: 9px;
  --ease: 170ms cubic-bezier(0.2, 0.7, 0.2, 1);
  /* Each part of the venue in the report: muted, distinct, on the same graphite. */
  --part-pc: #4bbd94;
  --part-ps5: #d0b279;
  --part-rc: #5fb8c4;
  --part-pool: #7f9fc4;
  --part-snooker: #c4917f;
  --part-other: #8a9099;
  --part-turf: #8cbf8a;
  --part-snacks: #e4d8bd;
  --part-beverages: #b98b5c;
  --part-icecream: #ab9ec9;
  --display: "Inter Display", "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --text: "Inter", "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --side: 236px;
  color-scheme: dark;
}

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.16) transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: radial-gradient(1100px 520px at 72% -160px, rgba(255, 255, 255, 0.045), transparent 70%), var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
[hidden] { display: none !important; }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
svg { flex: none; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.warn-text { color: var(--warn); }
.num, .timer, .foot-total, .line-amount, .tile-price, .kv b, .sum b, .step b, .seat, .list td.r {
  font-family: var(--display);
  font-variant-numeric: tabular-nums lining-nums;
  font-feature-settings: "tnum" 1, "lnum" 1;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Icon tile and avatar ---------- */
.glyph { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--ink-3); box-shadow: var(--hi); transition: color var(--ease), background var(--ease), border-color var(--ease); }
.glyph svg { width: 18px; height: 18px; }
.glyph.lg { width: 44px; height: 44px; border-radius: 12px; }
.glyph.lg svg { width: 22px; height: 22px; }
.glyph.sm { width: 28px; height: 28px; border-radius: 8px; }
.glyph.sm svg { width: 15px; height: 15px; }
.glyph.jade { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }
.glyph.gold { color: var(--gold); background: var(--gold-soft); border-color: var(--gold-line); }
.glyph.warn { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.glyph.bad { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-line); }
.avatar { width: 30px; height: 30px; flex: none; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--gold-line); background: var(--gold-soft); color: var(--gold); font: 600 13px/1 var(--display); }

/* ---------- Buttons ---------- */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 42px;
  padding: 0 16px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: linear-gradient(180deg, #1d2025 0%, #171a1e 100%);
  box-shadow: var(--hi), 0 1px 2px rgba(0, 0, 0, 0.35);
  color: var(--ink);
  font-weight: 600;
  letter-spacing: 0.005em;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--ease), border-color var(--ease), color var(--ease), transform var(--ease), box-shadow var(--ease), opacity var(--ease);
}
.btn svg { width: 17px; height: 17px; color: var(--ink-2); transition: color var(--ease); }
.btn:hover { border-color: var(--line-bold); background: linear-gradient(180deg, #24282e 0%, #1c1f24 100%); }
.btn:hover svg { color: var(--ink); }
.btn:active { transform: translateY(1px); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
.btn.primary { border-color: #2a9070; background: linear-gradient(180deg, #218060 0%, var(--accent-deep) 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 1px 2px rgba(0, 0, 0, 0.45), 0 10px 20px -14px rgba(0, 0, 0, 0.9); color: var(--on-accent); }
.btn.primary svg { color: var(--on-accent); }
.btn.primary:hover { border-color: #33a07d; background: linear-gradient(180deg, #248868 0%, #1b6f54 100%); }
/* The firm, neutral button a station uses to stop a timer: prominent by weight and place, not by colour. */
.btn.tonal { border-color: var(--line-bold); background: linear-gradient(180deg, #2a2e35 0%, #21252b 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 1px 2px rgba(0, 0, 0, 0.4); }
.btn.tonal svg { color: var(--danger); width: 13px; height: 13px; }
.btn.tonal:hover { border-color: rgba(255, 255, 255, 0.3); background: linear-gradient(180deg, #31363d 0%, #262b31 100%); }
.btn.tonal:hover svg { color: var(--danger); }
/* Start and Check In: a neutral button whose small icon carries the jade. */
.btn.go svg { color: var(--accent); width: 14px; height: 14px; }
.btn.go:hover { border-color: var(--accent-line); }
.btn.go:hover svg { color: var(--accent); }
.btn.quiet { min-height: 36px; padding: 0 10px; border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2); font-weight: 500; }
.btn.quiet:hover { color: var(--ink); background: rgba(255, 255, 255, 0.05); border-color: transparent; }
.btn.quiet svg { width: 16px; height: 16px; }
.btn.danger { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); }
.btn.danger svg { color: var(--danger); }
.btn.block { width: 100%; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
/* Saving: a small ring turns beside the label. */
.btn.loading { opacity: 0.85; }
.btn.loading::before { content: ""; width: 14px; height: 14px; border: 2px solid rgba(255, 255, 255, 0.3); border-top-color: var(--on-accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
.icon-btn { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--r-sm); background: transparent; color: var(--ink-2); cursor: pointer; transition: background var(--ease), color var(--ease), border-color var(--ease), transform var(--ease); }
.icon-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.06); border-color: var(--line); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn[aria-expanded=true] { color: var(--ink); background: rgba(255, 255, 255, 0.08); border-color: var(--line-strong); }
/* Paused: the button now offers Resume, in amber. */
.icon-btn.on { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
/* Small actions at the end of a list row: an icon in its own frame beside a button, both the same height. */
.row-tools { display: inline-flex; align-items: center; justify-content: flex-end; gap: 8px; }
.row-tools .icon-btn { width: 42px; height: 42px; border-color: var(--line-strong); background: var(--raised); box-shadow: var(--hi); color: var(--gold); }
.row-tools .icon-btn:hover { color: var(--ink); }
.row-tools .icon-btn.placeholder { visibility: hidden; }

/* ---------- Fields ---------- */
.field { display: grid; gap: 7px; margin-bottom: 18px; }
.field > span { font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: 0.01em; }
input[type=text], input[type=tel], input[type=number], input[type=password], input[type=search], input[type=date], input[type=time], input[type=datetime-local], select, textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 14px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-sm);
  background: var(--inset);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45);
  transition: border-color var(--ease), box-shadow var(--ease), background var(--ease);
}
input:hover, select:hover { border-color: var(--line-bold); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--accent-line); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45), 0 0 0 3px var(--accent-soft); }
input::placeholder { color: var(--ink-3); }
input[type=number] { font-family: var(--display); font-variant-numeric: tabular-nums; font-size: 16px; font-weight: 600; -moz-appearance: textfield; appearance: textfield; }
input[type=number]::-webkit-outer-spin-button, input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
/* A selection box drawn to match: a soft square that fills with jade and a tick. */
input[type=checkbox] { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; flex: none; margin: 0; display: grid; place-content: center; border: 1.5px solid var(--line-bold); border-radius: 6px; background: var(--inset); cursor: pointer; transition: background var(--ease), border-color var(--ease); }
input[type=checkbox]::before { content: ""; width: 11px; height: 11px; background: var(--on-accent); clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%); transform: scale(0); transition: transform 140ms cubic-bezier(0.2, 0.7, 0.2, 1); }
input[type=checkbox]:hover { border-color: var(--ink-3); }
input[type=checkbox]:checked { background: var(--accent-strong); border-color: var(--accent); }
input[type=checkbox]:checked::before { transform: scale(1); }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); margin-bottom: 10px; cursor: pointer; transition: border-color var(--ease), background var(--ease); }
.check:hover { border-color: var(--line-strong); }
.check.warn { border-color: var(--warn-line); background: var(--warn-soft); }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--inset); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); gap: 2px; flex-wrap: wrap; }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; min-width: 50px; padding: 0 14px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--ink-2); font-weight: 600; cursor: pointer; transition: background var(--ease), color var(--ease), border-color var(--ease); }
.seg button svg { width: 16px; height: 16px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { background: linear-gradient(180deg, #2b2f36 0%, #22262c 100%); border-color: var(--line-strong); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 1px 3px rgba(0, 0, 0, 0.5); }
.seg button[aria-pressed=true] svg { color: var(--accent); }
.seg.method button { min-width: 78px; }
.field > .seg { justify-self: start; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 14px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink-2); font-weight: 600; cursor: pointer; transition: background var(--ease), color var(--ease), border-color var(--ease); }
.chip svg { width: 16px; height: 16px; }
.chip:hover { color: var(--ink); border-color: var(--line-bold); }
.chip[aria-pressed=true] { border-color: var(--accent-line); color: var(--ink); background: var(--accent-soft); }
.chip[aria-pressed=true] svg { color: var(--accent); }
.chip .num { color: var(--ink-3); font-weight: 600; }
.chip[aria-pressed=true] .num { color: var(--ink-2); }
.suggest { display: grid; gap: 4px; margin-top: -10px; margin-bottom: 18px; }
.suggest button { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--raised); cursor: pointer; text-align: left; transition: border-color var(--ease), background var(--ease); }
.suggest button:hover { border-color: var(--line-bold); background: var(--hover); }
.suggest-who { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; }

/* ---------- Shell ---------- */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--side) minmax(0, 1fr); }
.side { display: flex; flex-direction: column; padding: 20px 12px 14px; background: linear-gradient(180deg, #101216 0%, #0c0d10 100%); border-right: 1px solid var(--line); min-height: 0; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 22px; }
.brand-mark { width: 48px; height: 48px; flex: none; display: grid; place-items: center; padding: 4px; border: 1px solid var(--line-strong); border-radius: 13px; background: radial-gradient(90% 90% at 50% 25%, #30353d 0%, #22262c 70%); box-shadow: var(--hi), 0 1px 2px rgba(0, 0, 0, 0.5), 0 8px 18px -10px rgba(0, 0, 0, 0.9); }
.brand-mark img { width: 100%; height: 100%; object-fit: contain; display: block; }
.wordmark { font-family: var(--display); font-weight: 650; font-size: 14px; letter-spacing: 0.26em; text-transform: uppercase; white-space: nowrap; line-height: 1.25; }
.side nav { display: grid; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border: 1px solid transparent; border-radius: var(--r-sm); background: transparent; color: var(--ink-2); font-weight: 500; cursor: pointer; text-align: left; position: relative; transition: background var(--ease), color var(--ease), border-color var(--ease); }
.nav-item svg { width: 18px; height: 18px; color: var(--ink-3); transition: color var(--ease); }
.nav-item:hover { color: var(--ink); background: rgba(255, 255, 255, 0.04); }
.nav-item:hover svg { color: var(--ink-2); }
.nav-item.on { color: var(--ink); background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.04)); border-color: var(--line); box-shadow: var(--hi); font-weight: 600; }
.nav-item.on::before { content: ""; position: absolute; left: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.nav-item.on svg { color: var(--accent); }
.count { margin-left: auto; min-width: 22px; height: 22px; padding: 0 7px; display: inline-grid; place-items: center; border-radius: 999px; border: 1px solid var(--gold-line); background: var(--gold-soft); color: var(--gold); font: 600 13px/1 var(--display); font-variant-numeric: tabular-nums; }
.side-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); }
.account { display: flex; align-items: center; gap: 10px; padding: 6px 4px 6px 8px; }
.account-who { flex: 1; min-width: 0; display: grid; line-height: 1.25; }
.account-who .who { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account-who .role { font-size: 13px; color: var(--ink-3); }
main { min-width: 0; min-height: 0; overflow-y: auto; padding: 0 28px 40px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; }
.top h1 { font-family: var(--display); font-size: 23px; font-weight: 650; letter-spacing: -0.02em; }
.top-tools { display: flex; align-items: center; gap: 8px; }
.sync { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.sync i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.sync.stale { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
.sync.stale i { background: var(--warn); }
/* Changes on screen that the server is still confirming. */
.sync.saving { color: var(--ink); }
.sync.saving i { background: var(--gold); }
.page-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 18px; }
.page-bar:empty { display: none; }
.page-bar .grow { flex: 1; min-width: 180px; }
.page-bar .bar-row { flex-basis: 100%; display: flex; }
.search { position: relative; flex: 1; min-width: 200px; display: flex; }
.search svg { position: absolute; left: 13px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: var(--ink-3); pointer-events: none; }
.search input { padding-left: 38px; }
.tabbar { display: none; }

/* In the page flow, so a message never covers a station or a payment control. */
/* A note stays in view at the top while the page is scrolled, so it is seen after a sheet closes. */
.notice { position: sticky; top: 12px; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; padding: 9px 10px 9px 14px; border: 1px solid var(--accent-line); border-radius: var(--r); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface); box-shadow: var(--shadow); animation: rise 200ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.notice-text, .status-text { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.notice-text svg, .status-text svg { width: 18px; height: 18px; margin-top: 2px; color: var(--accent); }
.notice.error { border-color: var(--danger-line); background: linear-gradient(var(--danger-soft), var(--danger-soft)), var(--surface); }
.notice.error svg, .sheet-status.error svg { color: var(--danger); }
.notice.pending { border-color: var(--warn-line); background: linear-gradient(var(--warn-soft), var(--warn-soft)), var(--surface); }
.notice.pending svg, .sheet-status.pending svg { color: var(--warn); }
.notice .btn { min-height: 34px; }
.notice .icon-btn svg { color: var(--ink-2); }

/* ---------- Cards share one body: a faint top-lit gradient, a hairline and a soft shadow ---------- */
.station, .cat, .panel, .table-wrap, .rep-card, .floor-summary, .turf-board {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--card);
  box-shadow: var(--hi), var(--shadow);
}

/* ---------- Home ---------- */
.meter { display: flex; align-items: center; gap: 3px; width: 100%; }
.meter i { flex: 1; max-width: 30px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); transition: background var(--ease); }
.meter i.on { background: var(--accent); }
/* The four systems fill the screen, two by two. */
/* Five parts of the floor: two large tiles above, three below. */
.cats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-auto-rows: 1fr; gap: 18px; min-height: calc(100dvh - 190px); }
.cats .cat { grid-column: span 2; }
.cats .cat:nth-child(-n+2) { grid-column: span 3; }
.cat { display: flex; flex-direction: column; justify-content: space-between; gap: 18px; padding: 26px 28px; cursor: pointer; text-align: left; position: relative; transition: border-color var(--ease), background var(--ease); }
.cat:hover { border-color: var(--line-bold); }
.cat.live { border-color: rgba(75, 189, 148, 0.24); background: linear-gradient(180deg, rgba(75, 189, 148, 0.07) 0%, rgba(75, 189, 148, 0) 110px), var(--card); }
.cat-top { display: flex; align-items: flex-start; justify-content: space-between; }
.cat-open { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; color: var(--ink-3); transition: color var(--ease), transform var(--ease), background var(--ease); }
.cat-open svg { width: 16px; height: 16px; }
.cat:hover .cat-open { color: var(--ink); background: rgba(255, 255, 255, 0.06); transform: translateX(2px); }
.cat-body { display: grid; gap: 2px; }
.cat .glyph.lg { width: 56px; height: 56px; border-radius: 15px; }
.cat .glyph.lg svg { width: 27px; height: 27px; }
.cat-name { font-family: var(--display); font-size: 34px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.1; }
.cat-line { font-size: 16px; color: var(--ink-2); }
.cat .meter i { height: 5px; max-width: 44px; }
.cat-line b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.cat-line.full { color: var(--warn); font-weight: 600; }

/* ---------- Top of a category: free and in use, then every unit as a pill ---------- */
.floor-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; padding: 14px 16px; margin-bottom: 16px; }
.tallies { display: flex; gap: 8px; }
.tally { display: grid; gap: 1px; min-width: 86px; padding: 8px 14px 9px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--inset); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45); }
.tally b { font-size: 24px; font-weight: 650; line-height: 1.1; letter-spacing: -0.02em; }
.tally span { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.tally.live b { color: var(--accent); }
.unit-pills { flex: 1; min-width: 240px; display: flex; flex-wrap: wrap; gap: 8px; }
.unit-pill { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 999px; background: rgba(255, 255, 255, 0.02); color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: background var(--ease), border-color var(--ease), color var(--ease); }
.unit-pill:hover { border-color: var(--line-bold); color: var(--ink); }
.unit-pill > i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.unit-pill .meter { width: auto; gap: 2px; }
.unit-pill .meter i { flex: none; width: 7px; }
.unit-pill .num { color: var(--ink-3); font-weight: 600; }
.unit-pill.live { color: var(--ink); border-color: var(--accent-line); background: var(--accent-soft); }
.unit-pill.live > i { background: var(--accent); }
.unit-pill.live .num { color: var(--ink-2); }
.unit-pill.held { color: var(--ink); border-color: var(--warn-line); background: var(--warn-soft); }
.unit-pill.held > i, .unit-pill.held .meter i.on { background: var(--warn); }

/* ---------- Station cards: each one a small control panel ---------- */
.stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; align-items: start; }
.station { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px; min-width: 0; transition: border-color var(--ease); }
/* In use: a faint jade wash from the top and a fine lit edge. Paused: the same in amber. */
.station.live { border-color: rgba(75, 189, 148, 0.24); background: linear-gradient(180deg, rgba(75, 189, 148, 0.07) 0%, rgba(75, 189, 148, 0) 120px), var(--card); }
.station.live::before { content: ""; position: absolute; left: 18px; right: 18px; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); opacity: 0.55; }
.station.held { border-color: rgba(224, 171, 85, 0.26); background: linear-gradient(180deg, rgba(224, 171, 85, 0.06) 0%, rgba(224, 171, 85, 0) 120px), var(--card); }
.station.held::before { background: linear-gradient(90deg, transparent, var(--warn), transparent); }
.station.tap { cursor: pointer; }
.station.tap:hover { border-color: rgba(75, 189, 148, 0.4); }
.station.held.tap:hover { border-color: rgba(224, 171, 85, 0.42); }
.station-head { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.station-title { flex: 1; min-width: 0; display: grid; gap: 3px; }
.station-name { font-family: var(--display); font-size: 17px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.2; }
.station-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.station-meta .meter { width: auto; }
.station-meta .meter i { flex: none; width: 11px; }
.station-tools { display: flex; align-items: center; gap: 4px; }
.state { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: rgba(255, 255, 255, 0.03); color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.state i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); }
.state.live { color: var(--ink); }
.state.live i { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.state.held { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
.state.held i { background: var(--warn); }
.who-row { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: rgba(255, 255, 255, 0.025); }
.who-row > svg { width: 16px; height: 16px; color: var(--gold); }
.station-who { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.clock-panel { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 12px 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--inset); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5); }
.clock-main { display: grid; gap: 4px; min-width: 0; }
.clock-panel .icon-btn { width: 40px; height: 40px; border-color: var(--line-strong); background: var(--raised); }
.clock-panel .icon-btn.on { border-color: var(--warn-line); background: var(--warn-soft); }
.timer { font-size: 32px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
.timer i { font-style: normal; color: var(--ink-3); padding: 0 1px; }
.timer.small { font-size: 15px; letter-spacing: 0; }
/* A paused timer stands still and turns amber. */
.timer.held, .timer.held i { color: var(--warn); }
.slots { border: 1px solid var(--line); border-radius: var(--r); background: var(--inset); box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.45); }
.slot { position: relative; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 6px 6px 6px 12px; border-top: 1px solid var(--line); cursor: pointer; transition: background var(--ease); }
.slot:first-child { border-top: 0; border-radius: 11px 11px 0 0; }
.slot:last-child { border-radius: 0 0 11px 11px; }
.slot:only-child { border-radius: 11px; }
.slot:hover { background: rgba(255, 255, 255, 0.025); }
.slot.picked { background: rgba(255, 255, 255, 0.045); }
.slot.picked::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 0 2px 2px 0; background: var(--accent); }
.seat { width: 24px; height: 24px; flex: none; display: inline-grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--raised); color: var(--ink-2); font-size: 13px; font-weight: 600; line-height: 1; transition: color var(--ease), border-color var(--ease), background var(--ease); }
.slot.picked .seat { color: var(--ink); border-color: var(--line-bold); }
.slot.held .seat { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
.slot-who { flex: 1; min-width: 0; }
/* A named player's tag sits under "Controller 2", so neither is ever cut off by the controls beside them. */
.slot-who b { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; font-weight: 600; white-space: nowrap; }
.slot-who .tag { margin-left: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.slot .icon-btn { width: 30px; height: 30px; }
/* Pause and resume sit in their own small frame, so they read as a control and not as punctuation. */
.slot .icon-btn[data-action] { border-color: var(--line-strong); background: var(--raised); box-shadow: var(--hi); }
.slot .icon-btn[data-action] svg, .clock-panel .icon-btn svg { width: 13px; height: 13px; }
.slot .icon-btn[data-action=resume] { border-color: var(--warn-line); background: var(--warn-soft); }
.slot .timer { margin-right: 2px; }
.station-actions { display: grid; grid-template-columns: 1.2fr 1fr; gap: 8px; }
.station-actions .wide { grid-column: 1 / -1; }
.station-actions .btn { padding: 0 10px; font-size: 14px; }
.station-links { display: flex; flex-wrap: wrap; gap: 4px; margin: -4px -10px -8px; }
.sheet-body .station-links { margin: -6px -10px 10px; }
.station-links .btn[aria-pressed=true] { color: var(--ink); background: rgba(255, 255, 255, 0.06); }

/* A booking that a start would leave without a place: said when the station is opened, with a box to go ahead anyway. */
.clash { display: flex; gap: 12px; padding: 12px 14px; margin-bottom: 18px; border: 1px solid var(--warn-line); border-radius: var(--r); background: var(--warn-soft); }
.clash > svg { width: 18px; height: 18px; margin-top: 2px; color: var(--warn); }
.clash-main { display: grid; gap: 4px; min-width: 0; }
.clash-ack { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-weight: 600; cursor: pointer; }
.station-meta.booked { color: var(--gold); }
.station-meta.booked svg { width: 14px; height: 14px; }
/* Money paid up front, and a reminder, sit at the end of the customer strip. */
.chip-paid, .remind { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; flex: none; }
.chip-paid { border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent); }
.chip-paid svg, .remind svg { width: 14px; height: 14px; }
.remind { border: 1px solid var(--gold-line); background: var(--gold-soft); color: var(--gold); cursor: pointer; transition: background var(--ease), color var(--ease); }
.remind .up { display: none; }
.remind.due { border-color: var(--warn); background: var(--warn); color: #1b1307; }
.remind.due .when { display: none; }
.remind.due .up { display: inline; }
.remind-now { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 18px; border: 1px solid var(--gold-line); border-radius: var(--r); background: var(--gold-soft); }
.remind-now > svg { width: 20px; height: 20px; color: var(--gold); }
.remind-now div { display: grid; line-height: 1.35; }
/* A reminder whose time has come blinks — the one place the app is meant to catch the eye. Reduced motion keeps a still amber edge. */
.station.due, .cat.due, .unit-pill.due { border-color: var(--warn); animation: remind 1.2s ease-in-out infinite; }
.nav-item.due::after, .tabbar button.due::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); animation: remind-dot 1.2s ease-in-out infinite; }
.nav-item.due::after { margin-left: auto; }
.tabbar button.due::after { position: absolute; top: 8px; right: calc(50% - 18px); }
@keyframes remind { 50% { box-shadow: var(--hi), var(--shadow), 0 0 0 4px rgba(224, 171, 85, 0.32); } }
@keyframes remind-dot { 50% { opacity: 0.25; } }

/* ---------- Panels, lists and tables ---------- */
.panel { padding: 20px; margin-bottom: 18px; }
.panel h2 { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: 0.01em; margin-bottom: 14px; }
.panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.panel-head h2 { margin: 0; }
.panel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.panel-grid .panel { margin: 0; }
/* Menus open over the edge of a table, so the wrap is not clipped; the corners are rounded on the cells instead. */
.table-wrap { overflow: visible; }
.list thead th:first-child { border-top-left-radius: 15px; }
.list thead th:last-child { border-top-right-radius: 15px; }
.list tbody tr:last-child td:first-child { border-bottom-left-radius: 15px; }
.list tbody tr:last-child td:last-child { border-bottom-right-radius: 15px; }
.list { width: 100%; border-collapse: collapse; }
.list th { text-align: left; font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: 0.03em; padding: 12px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; background: rgba(255, 255, 255, 0.015); }
.list td { padding: 13px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.list tr:last-child td { border-bottom: 0; }
.list tbody tr { transition: background var(--ease); }
.list tbody tr.click { cursor: pointer; }
.list tbody tr.click:hover { background: rgba(255, 255, 255, 0.035); }
.list .r { text-align: right; }
.list td.num { font-size: 15px; font-weight: 600; white-space: nowrap; }
.list td b { font-weight: 600; }
.list td.owing { color: var(--gold); }
.cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
.cell-text { min-width: 0; display: grid; line-height: 1.35; }
.cell > svg { width: 16px; height: 16px; color: var(--ink-3); }
.cell-tools { display: inline-flex; align-items: center; gap: 4px; }
.list .btn { min-height: 36px; padding: 0 12px; font-size: 14px; }
.empty { display: grid; justify-items: center; gap: 10px; padding: 44px 16px; text-align: center; color: var(--ink-2); }
.empty-title { font-weight: 600; color: var(--ink); }
.empty .btn { margin-top: 6px; }
.badge { display: inline-flex; align-items: center; gap: 7px; min-height: 26px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: rgba(255, 255, 255, 0.03); color: var(--ink-2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.9; }
.badge.good { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }
.badge.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-soft); }
.badge.gold { color: var(--gold); border-color: var(--gold-line); background: var(--gold-soft); }
.badge.bad { color: var(--danger); border-color: var(--danger-line); background: var(--danger-soft); }
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 9px 0; border-top: 1px solid var(--line); }
.kv:first-of-type { border-top: 0; }
.kv b { font-weight: 600; font-size: 15px; white-space: nowrap; }
.kv.total { padding-top: 12px; }
.kv.total b { font-size: 20px; letter-spacing: -0.01em; }
.kv.sub { padding-left: 14px; color: var(--ink-2); }
.kv.sub b { font-weight: 500; color: var(--ink-2); }
.kv.good b { color: var(--accent); }
.kv.gold b, .kv.gold > span { color: var(--gold); }
.rates { width: 100%; border-collapse: separate; border-spacing: 10px; margin: -10px; }
.rates th { font-size: 13px; font-weight: 500; color: var(--ink-2); text-align: left; padding: 0 4px; white-space: nowrap; }
.rates thead th span { display: inline-flex; align-items: center; gap: 8px; }
.rates thead th svg { width: 16px; height: 16px; color: var(--ink-3); }
.rates input { text-align: right; }
/* Loading: quiet bars where the rows will be. */
.skeleton { display: grid; gap: 0; }
.skeleton i { display: block; height: 58px; border-bottom: 1px solid var(--line); background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.04) 45%, transparent 70%) 0 0 / 220% 100%; animation: shimmer 1.4s linear infinite; }
.skeleton i:last-child { border-bottom: 0; }

/* ---------- A comment on a move, and the comments shown on a bill, booking or account ---------- */
.comment { display: grid; gap: 10px; margin-top: 14px; }
.comment .check { margin: 0; }
.comment-box input { width: 100%; }
.notes { display: grid; gap: 8px; margin-top: 14px; }
.note { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--gold-line); border-radius: var(--r-sm); background: var(--gold-soft); }
.note > svg { width: 16px; height: 16px; margin-top: 2px; color: var(--gold); }
.note-main { display: grid; gap: 2px; min-width: 0; }
.note-text { color: var(--ink); overflow-wrap: anywhere; }

/* ---------- Reports: what was earned, received and owed; each part of the venue; two rings ---------- */
.rep-range { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.rep-dates { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 11px; background: var(--inset); }
.rep-dates input { width: auto; min-height: 36px; padding: 0 8px; border: 0; background: transparent; box-shadow: none; }
.rep-export { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
.rep-export select { width: 150px; }
.rep-top { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; margin-bottom: 16px; }
.rep-main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; align-items: start; }
.rep-charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.rep-card { padding: 22px 24px; min-width: 0; }
.rep-kicker { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
.rep-when { letter-spacing: 0.02em; text-transform: none; font-weight: 500; color: var(--ink-2); }
/* The earned figure: the one large number, lit faintly from above in champagne. */
.rep-lead { position: relative; background: linear-gradient(180deg, rgba(208, 178, 121, 0.07) 0%, rgba(208, 178, 121, 0) 55%), var(--card); border-color: var(--gold-line); }
.rep-big { font-family: var(--display); font-size: 46px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; }
.rep-mid { font-family: var(--display); font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 8px; }
.rep-stack { display: flex; gap: 3px; height: 8px; margin: 18px 0 14px; border-radius: 4px; overflow: hidden; }
.rep-stack i { min-width: 4px; }
.rep-stack.none { background: rgba(255, 255, 255, 0.06); }
.rep-line { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 9px 0; border-top: 1px solid var(--line); color: var(--ink-2); }
.rep-line b { color: var(--ink); font-weight: 600; font-size: 15px; white-space: nowrap; }
.rep-line.gold b { color: var(--gold); }
.rep-line.good b { color: var(--accent); }
.rep-line.total { color: var(--ink); font-weight: 600; }
.rep-line.total b { font-size: 20px; letter-spacing: -0.01em; }
.rep-credit .rep-line:first-of-type { border-top: 0; }
.rep-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.rep-head h2 { font-family: var(--display); font-size: 16px; font-weight: 600; letter-spacing: 0.01em; }
.rep-note { font-size: 13px; color: var(--ink-3); }
/* One row per part: icon, name and use, the amount, and a hairline bar of its share. */
.rep-rows { display: grid; }
.rep-row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; grid-template-areas: "icon main amount" "icon bar bar"; column-gap: 14px; row-gap: 8px; align-items: center; padding: 14px 0; border-top: 1px solid var(--line); }
.rep-row:first-child { border-top: 0; }
.rep-icon { grid-area: icon; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 11px; background: var(--raised); box-shadow: var(--hi); align-self: start; }
.rep-icon svg { width: 18px; height: 18px; }
.rep-row-main { grid-area: main; display: grid; gap: 2px; min-width: 0; }
.rep-row-main b { font-weight: 600; font-size: 15px; }
.rep-use { color: var(--ink-2); font-size: 13px; }
.rep-amount { grid-area: amount; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; }
.rep-bar { grid-area: bar; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
.rep-bar i { display: block; height: 100%; border-radius: 2px; transition: width var(--ease); }
/* The rings. */
.rep-chart-body { display: grid; grid-template-columns: 180px minmax(0, 1fr); align-items: center; gap: 26px; margin-top: 10px; }
.rep-ring { position: relative; width: 180px; height: 180px; }
.rep-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.rep-ring circle { fill: none; stroke-width: 11; }
.rep-track { stroke: rgba(255, 255, 255, 0.06); }
.rep-arc { stroke-linecap: butt; }
.rep-ring-centre { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 2px; }
.rep-ring-centre { padding: 0 30px; }
.rep-ring-centre b { font-family: var(--display); font-size: 21px; font-weight: 650; letter-spacing: -0.02em; }
.rep-ring-centre span { font-size: 13px; color: var(--ink-3); }
.rep-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rep-legend li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); color: var(--ink-2); }
.rep-legend li:first-child { border-top: 0; }
.rep-legend i { width: 10px; height: 10px; border-radius: 3px; }
.rep-legend b { color: var(--ink); font-weight: 600; }
.rep-legend.inline { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.rep-legend.inline li { display: inline-grid; grid-template-columns: 10px auto auto; padding: 0; border: 0; }
/* The day close, for one day. */
.rep-close { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; grid-template-areas: "icon main action"; align-items: center; column-gap: 14px; row-gap: 12px; padding: 16px 20px; }
.rep-close .btn { grid-area: action; }
.rep-close .rep-icon { align-self: center; color: var(--ink-2); }
.rep-close.done .rep-icon { color: var(--accent); border-color: var(--accent-line); background: var(--accent-soft); }

/* ---------- Menu tiles (Add Items, Snacks & beverages) ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.tile { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; min-height: 104px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); box-shadow: var(--hi); cursor: pointer; text-align: left; transition: border-color var(--ease), background var(--ease); }
.tile:hover { border-color: var(--line-bold); background: var(--hover); }
.tile.on { border-color: var(--accent-line); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--raised); }
.tile-head { display: flex; align-items: flex-start; gap: 10px; }
.tile-head .glyph { width: 32px; height: 32px; border-radius: 9px; background: var(--surface); }
.tile-head .glyph svg { width: 16px; height: 16px; }
.tile-text { min-width: 0; display: grid; line-height: 1.3; }
.tile-name { font-weight: 600; overflow-wrap: anywhere; }
.tile-price { color: var(--ink-2); font-size: 14px; white-space: nowrap; }
.tile-add { display: flex; align-items: center; justify-content: center; gap: 6px; height: 34px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--ink-3); font-size: 13px; font-weight: 600; transition: color var(--ease), border-color var(--ease); }
.tile-add svg { width: 14px; height: 14px; }
.tile:hover .tile-add { color: var(--ink); border-color: var(--line-bold); }
.tile .step { display: flex; justify-content: space-between; width: 100%; }
.step { display: inline-flex; align-items: center; gap: 6px; }
.step button { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--inset); color: var(--ink); cursor: pointer; transition: border-color var(--ease), background var(--ease), transform var(--ease); }
.step button svg { width: 15px; height: 15px; }
.step button:hover { border-color: var(--line-bold); background: var(--hover); }
.step button:active { transform: scale(0.94); }
.step b { min-width: 28px; text-align: center; font-size: 16px; font-weight: 600; }

/* ---------- The counter: products on the left, the sale on the right ---------- */
.counter { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.counter .panel { margin: 0; }
.till { position: sticky; top: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.till .panel-head { margin-bottom: 0; }
.till-ways .btn { padding: 0 8px; font-size: 14px; }
.basket { display: grid; }
.basket-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.basket-line:first-child { border-top: 0; }
.basket-line span { min-width: 0; overflow-wrap: anywhere; }
.basket-line b { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.basket-empty { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); color: var(--ink-2); font-size: 14px; }
.basket-empty svg { width: 16px; height: 16px; color: var(--ink-3); }
.till-total { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 12px; border-top: 1px solid var(--line-strong); }
.till-ways { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.till .seg { display: grid; grid-template-columns: 1fr 1fr; }

/* ---------- Sheet: header, scrolling body, pinned footer ---------- */
.sheet { margin: 0 0 0 auto; inset: 0; width: min(560px, 100vw); height: 100dvh; max-height: 100dvh; max-width: 100vw; padding: 0; border: 0; border-left: 1px solid var(--line-strong); background: linear-gradient(180deg, #15181c 0%, #111316 100%); box-shadow: -32px 0 80px -24px rgba(0, 0, 0, 0.8); color: var(--ink); overflow: hidden; }
.sheet[open] { animation: sheet-in 200ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.sheet::backdrop { background: rgba(4, 5, 6, 0.62); animation: fade 200ms ease-out; }
.sheet form { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.sheet-head { flex: none; display: flex; align-items: center; gap: 14px; padding: 18px 16px 16px 24px; border-bottom: 1px solid var(--line); }
.sheet-head-text { flex: 1; min-width: 0; }
.sheet-head h2 { font-family: var(--display); font-size: 20px; font-weight: 650; letter-spacing: -0.015em; line-height: 1.25; overflow-wrap: anywhere; }
.sheet-head p:empty { display: none; }
.sheet-head p { margin-top: 1px; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 24px; }
.sheet-status { flex: none; margin: 0 24px 12px; padding: 10px 14px; border: 1px solid var(--accent-line); border-radius: var(--r-sm); background: var(--accent-soft); font-size: 14px; }
.sheet-status:empty { display: none; }
.sheet-status.error { border-color: var(--danger-line); background: var(--danger-soft); }
.sheet-status.pending { border-color: var(--warn-line); background: var(--warn-soft); }
.sheet-status .btn { margin-top: 8px; min-height: 36px; }
.sheet-foot { flex: none; display: grid; gap: 12px; padding: 16px 24px 20px; border-top: 1px solid var(--line); background: var(--bg-2); box-shadow: 0 -14px 24px -18px rgba(0, 0, 0, 0.9); }
.sheet-foot:empty { display: none; }
.sheet-foot .btn.primary.block, .sheet-foot .btn.block { min-height: 46px; }
.foot-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.foot-row.end { align-items: flex-end; }
.foot-row .field { margin: 0; flex: 1; }
.foot-row > .seg { align-self: flex-end; }
.foot-label { font-size: 13px; font-weight: 500; color: var(--ink-2); letter-spacing: 0.02em; }
.foot-total { font-size: 32px; font-weight: 650; line-height: 1; letter-spacing: -0.025em; }
.foot-total.clear { color: var(--accent); }
.foot-links { display: flex; flex-wrap: wrap; gap: 4px; margin: -4px -10px; }
/* Figure rows: subtotal, discount, total, already paid. The large number beneath is what is still outstanding. */
.sums { display: grid; gap: 5px; }
.sums:empty { display: none; }
.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; color: var(--ink-2); font-size: 14px; }
.sum b { font-weight: 600; font-size: 15px; color: var(--ink); white-space: nowrap; }
.sum.strong { color: var(--ink); font-weight: 600; padding-top: 6px; margin-top: 2px; border-top: 1px solid var(--line); }
.sum.warn-text, .sum.warn-text b { color: var(--warn); }
.sum.good, .sum.good b { color: var(--accent); }
.sum.extra, .sum.extra b { color: var(--gold); }
/* The other ways to close a bill, side by side under the main button. */
.actions { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.action { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 58px; padding: 8px 4px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--hi); color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; transition: color var(--ease), background var(--ease), border-color var(--ease), transform var(--ease); }
.action:hover { color: var(--ink); background: var(--raised); border-color: var(--line-bold); }
.action:active { transform: translateY(1px); }
.action svg { width: 18px; height: 18px; color: var(--ink-3); transition: color var(--ease); }
.action:hover svg { color: var(--gold); }

/* A bill reads as a ledger: a heading per system, hairline rows, amounts in one right-hand column. */
.group-title { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-size: 15px; font-weight: 600; margin: 22px 0 8px; }
.group-title:first-child { margin-top: 0; }
.group-title > svg { width: 17px; height: 17px; color: var(--ink-3); }
.group-title .glyph { width: 28px; height: 28px; border-radius: 8px; }
.group-title .glyph svg { width: 15px; height: 15px; }
.group-title .small { margin-left: auto; font-family: var(--text); font-weight: 500; }
.lines { border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); box-shadow: var(--hi); padding: 0 14px; }
.lines .line:first-child { border-top: 0; }
.line { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-height: 54px; }
.line-main { flex: 1; min-width: 0; }
.line-main b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.line-main .small { display: block; margin-top: 1px; }
.line-amount { font-size: 15px; font-weight: 600; white-space: nowrap; min-width: 60px; text-align: right; }
.line-amount.good { color: var(--accent); }
.line.pick { cursor: pointer; transition: background var(--ease); margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
.line.pick:hover { background: rgba(255, 255, 255, 0.03); }
.line.pick > svg { width: 17px; height: 17px; color: var(--ink-3); transition: transform var(--ease); }
.line.pick[aria-expanded=true] > svg { transform: rotate(180deg); }
.line.pick[aria-pressed=true] { background: rgba(255, 255, 255, 0.045); }
.lines > .line.pick:first-child { border-radius: 11px 11px 0 0; }
.lines > .line.pick:last-child { border-radius: 0 0 11px 11px; }
.lines > .line.pick:only-child { border-radius: 11px; }
.tag { display: inline-block; margin-left: 8px; padding: 0 9px; border: 1px solid var(--gold-line); border-radius: 999px; background: var(--gold-soft); color: var(--ink); font-size: 13px; font-weight: 500; line-height: 20px; vertical-align: 1px; white-space: nowrap; }
/* What a bill on a credit account was for, opened under its row. */
.breakdown { padding: 6px 0 14px; border-top: 1px dashed var(--line-strong); animation: rise 180ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.breakdown .lines { background: var(--surface); }
.breakdown .group-title { font-size: 14px; margin: 14px 0 6px; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; min-width: 208px; display: grid; gap: 1px; padding: 5px; border: 1px solid var(--line-strong); border-radius: var(--r); background: #1f2329; box-shadow: var(--hi), var(--shadow-pop); animation: pop 140ms cubic-bezier(0.2, 0.7, 0.2, 1); transform-origin: top right; }
.menu-list button { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background var(--ease); }
.menu-list button svg { width: 16px; height: 16px; color: var(--ink-3); }
.menu-list button:hover { background: rgba(255, 255, 255, 0.07); }
.menu-list button:hover svg { color: var(--ink); }
.menu-list button.danger, .menu-list button.danger svg { color: var(--danger); }
.menu-list button.danger:hover { background: var(--danger-soft); }
.time-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; color: var(--ink-2); }
.time-lead { display: inline-flex; align-items: center; gap: 9px; }
.time-lead svg { width: 16px; height: 16px; color: var(--ink-3); }
/* Bill heading on a receipt: what state the bill is in, whose it is, and when. */
.bill-head { display: flex; align-items: center; gap: 14px; padding: 14px; margin-bottom: 4px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); box-shadow: var(--hi); }
.bill-who { flex: 1; min-width: 0; display: grid; line-height: 1.35; }
.bill-head .who { font-weight: 600; overflow-wrap: anywhere; }
.bill-tools { display: inline-flex; align-items: center; gap: 4px; }
/* The money part of a bill, in three plain blocks: the bill, what was paid towards it, anything else taken with it. */
.summary { margin-top: 18px; padding: 4px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); box-shadow: var(--hi); }
.summary.extra { border-color: var(--gold-line); background: linear-gradient(var(--gold-soft), var(--gold-soft)), var(--raised); }
.summary-title { display: flex; align-items: center; gap: 9px; margin: 20px 2px 0; font-family: var(--display); font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.summary-title + .summary { margin-top: 8px; }
.summary .kv.due { padding: 12px 0; }
.summary .kv.due b { font-size: 24px; letter-spacing: -0.02em; }
.summary .kv.due.clear b { color: var(--accent); }
.summary .kv.due.owing b { color: var(--warn); }
.pay-line { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); min-height: 50px; }
.pay-line:first-child { border-top: 0; }
.pay-line .glyph { width: 30px; height: 30px; border-radius: 9px; }
.pay-line .glyph svg { width: 16px; height: 16px; }
.pay-main { flex: 1; min-width: 0; display: grid; line-height: 1.35; }
.pay-main b { font-weight: 600; }
.pay-line > b { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.pay-line.gold > b { color: var(--gold); }
/* Settled: a calm confirmation above Print Receipt and Done. */
.settled { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--accent-line); border-radius: var(--r); background: var(--accent-soft); animation: rise 220ms cubic-bezier(0.2, 0.7, 0.2, 1); }
.settled > svg { width: 22px; height: 22px; color: var(--accent); }
.settled div { display: grid; line-height: 1.35; }
.settled b { font-weight: 600; }
.settled.gold { border-color: var(--gold-line); background: var(--gold-soft); }
.settled.gold > svg { color: var(--gold); }
.settled.bad { border-color: var(--danger-line); background: var(--danger-soft); }
.settled.bad > svg { color: var(--danger); }
/* A credit account's balance, the one large figure on its sheet. */
.hero { display: flex; align-items: center; gap: 14px; padding: 16px; border: 1px solid var(--gold-line); border-radius: var(--r); background: linear-gradient(135deg, rgba(208, 178, 121, 0.14), rgba(208, 178, 121, 0.03)), var(--raised); box-shadow: var(--hi); }
.hero.clear { border-color: var(--line); background: var(--raised); }
.hero-main { flex: 1; min-width: 0; display: grid; gap: 4px; }

/* ---------- Turf: one day as a board, an hour per row and a column per court ---------- */
.turf-day { display: inline-flex; align-items: center; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--inset); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
.turf-day .icon-btn { width: 34px; height: 34px; }
.turf-day-word { display: inline-flex; align-items: baseline; gap: 8px; padding: 0 6px; font-family: var(--display); white-space: nowrap; }
.turf-day-word b { font-weight: 600; }
/* The date field shows only its calendar icon; the day is written beside it. */
.turf-day input { width: 34px; min-height: 34px; padding: 0 7px; border-color: transparent; background: transparent; color: var(--ink-2); cursor: pointer; }
.turf-day input::-webkit-datetime-edit { display: none; }
.turf-day input::-webkit-calendar-picker-indicator { margin: 0; cursor: pointer; opacity: 0.8; }
.tally.full b { color: var(--warn); }
/* An hour is tall enough for a one-hour booking's two lines: the name and its time. */
.turf-board { display: grid; grid-template-columns: 76px repeat(2, minmax(0, 1fr)); grid-template-rows: 40px; grid-auto-rows: 64px; gap: 6px; padding: 14px 16px 16px; }
.turf-court-head { grid-row: 1; display: flex; align-items: center; gap: 9px; padding: 0 12px; border-bottom: 1px solid var(--line); font-family: var(--display); font-size: 15px; }
.turf-court-head svg { width: 17px; height: 17px; color: var(--ink-3); }
.turf-hour { grid-column: 1; display: flex; justify-content: flex-end; align-items: flex-start; gap: 6px; padding: 6px 8px 0 0; color: var(--ink-3); font: 600 13px/1.2 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.turf-hour.over { opacity: 0.55; }
.turf-hour.now { color: var(--accent); }
.turf-hour.now::before { content: ""; width: 6px; height: 6px; margin-top: 4px; border-radius: 50%; background: var(--accent); }
.turf-cell { display: flex; align-items: center; justify-content: center; gap: 6px; border: 1px dashed var(--line-strong); border-radius: var(--r-sm); background: rgba(255, 255, 255, 0.015); color: var(--ink-3); font-size: 13px; font-weight: 600; cursor: pointer; transition: border-color var(--ease), background var(--ease), color var(--ease); }
.turf-cell svg { width: 14px; height: 14px; }
.turf-cell:hover { border-style: solid; border-color: var(--accent-line); background: var(--accent-soft); color: var(--ink); }
.turf-cell.over { border-style: solid; border-color: var(--line); background: rgba(255, 255, 255, 0.01); cursor: default; opacity: 0.5; }
.turf-block { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 6px 12px; line-height: 1.35; border: 1px solid var(--accent-line); border-radius: var(--r-sm); background: linear-gradient(180deg, rgba(75, 189, 148, 0.15) 0%, rgba(75, 189, 148, 0.05) 100%), var(--raised); box-shadow: var(--hi), 0 1px 2px rgba(0, 0, 0, 0.4); color: var(--ink); text-align: left; cursor: pointer; overflow: hidden; transition: border-color var(--ease), background var(--ease); }
.turf-block:hover { border-color: rgba(75, 189, 148, 0.6); }
.turf-block.ended { border-color: var(--line-strong); background: var(--raised); color: var(--ink-2); }
.turf-block-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.turf-block-top > svg { width: 15px; height: 15px; color: var(--accent); }
.turf-block.ended .turf-block-top > svg { color: var(--ink-3); }
.turf-name { min-width: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; font-weight: 600; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
/* The WhatsApp confirmation beside the name: green until sent, then orange (owner's choice, a reminder only).
   The cross at the end cancels the booking. */
.turf-wa, .turf-x { flex: none; display: inline-grid; place-items: center; width: 28px; height: 24px; border: 1px solid transparent; border-radius: var(--r-sm); background: none; cursor: pointer; transition: color var(--ease), border-color var(--ease), background var(--ease); }
.turf-wa svg, .turf-x svg { width: 15px; height: 15px; }
.turf-wa { color: var(--accent); }
.turf-wa.sent { color: var(--warn); }
.turf-x { margin-left: auto; color: var(--ink-3); }
.turf-wa:hover, .turf-x:hover { border-color: var(--line-strong); background: rgba(255, 255, 255, 0.04); }
.turf-x:hover { color: var(--danger); }
.turf-block-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.turf-when { font-family: var(--display); font-size: 20px; letter-spacing: -0.01em; }
.turf-starts .chip { min-width: 74px; justify-content: center; }
.turf-share { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; }
.turf-mark { display: inline-flex; }
.turf-mark svg { width: 14px; height: 14px; }
.turf-mark.ok { color: var(--accent); }
.turf-mark.part { color: var(--warn); }
.turf-block-top .turf-mark { margin-left: auto; }
/* Over and settled: the day's past bookings under the board, in plain graphite with a jade tick, apart from the live board. */
.turf-past { margin-top: 18px; }
.turf-past-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.turf-past-item { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--inset); color: var(--ink-2); font: inherit; text-align: left; cursor: pointer; transition: border-color var(--ease); }
.turf-past-item:hover { border-color: var(--line-strong); }
.turf-past-item > svg { flex: none; width: 15px; height: 15px; color: var(--ink-3); }
.turf-past-main { flex: 1; display: grid; min-width: 0; }
.turf-past-main b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font-weight: 600; }
/* A booking split among players: the turf charge and discount, then Team A and Team B, a row per player. */
.turf-discount input { width: 120px; min-height: 36px; padding: 0 10px; text-align: right; font-family: var(--display); font-variant-numeric: tabular-nums; }
.group-title .btn.quiet { margin-left: auto; min-height: 32px; }
.group-title .badge.small { margin-left: auto; min-height: 22px; font-size: 13px; }
.turf-team { display: grid; gap: 8px; }
.turf-none { padding: 4px 2px; }
.turf-player { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--raised); box-shadow: var(--hi); }
/* Paid, on credit or moved: the card stays, green with a grey outline, so it is plain who is still to pay. */
.turf-player.cleared { background: linear-gradient(180deg, rgba(75, 189, 148, 0.2) 0%, rgba(75, 189, 148, 0.11) 100%), var(--raised); border-color: var(--line-bold); }
.turf-player.cleared .turf-player-main .muted { color: var(--ink-2); }
.turf-tick { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: rgba(75, 189, 148, 0.18); color: var(--accent); }
.turf-tick svg { width: 18px; height: 18px; }
/* Cash or UPI, chosen in place. */
.turf-pay { display: flex; align-items: center; gap: 6px; }
.turf-pay .btn { min-height: 38px; padding: 0 12px; }
.turf-pay .btn svg { color: var(--accent); }
.sheet-foot .turf-pay { display: grid; grid-template-columns: 1fr 1fr auto; }
.sheet-foot .turf-pay .btn { min-height: 46px; }
.turf-added { margin-top: -4px; }
.turf-added .chip { cursor: default; }
.turf-player-main { min-width: 0; display: grid; line-height: 1.35; }
.turf-player-main b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.turf-player-sum { display: grid; justify-items: end; gap: 3px; }
.turf-player-sum b { font-size: 16px; }
.turf-player-tools { display: inline-flex; align-items: center; gap: 2px; }
.turf-player-tools .icon-btn[data-action] { border-color: var(--line-strong); background: var(--surface); box-shadow: var(--hi); }
.turf-player-tools .icon-btn[data-action]:hover { color: var(--ink); border-color: var(--line-bold); }
.turf-paid { display: flex; align-items: center; gap: 10px; }
.turf-head-badge { margin-top: 6px; }
/* A WhatsApp message as it will be sent. */
.festival-emoji { width: 30px; flex: none; text-align: center; font-size: 20px; line-height: 1; }
.festival-ask { margin-bottom: 12px; color: var(--ink); font-weight: 600; }
.message-preview { margin: 0; padding: 16px; white-space: pre-wrap; border: 1px solid var(--line); border-radius: var(--r); background: var(--inset); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.45); color: var(--ink); font: 14px/1.6 var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
