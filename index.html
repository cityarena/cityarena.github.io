/* The wall behind the logo is lit, as in the owner's picture, so the logo's black triangle stands out whole. */
.stage-group::before { content: ""; position: absolute; z-index: -1; pointer-events: none; left: 50%; top: 30%; width: 190%; aspect-ratio: 1.15; transform: translate(-50%, -50%); background: radial-gradient(closest-side, rgba(78, 118, 92, 0.42) 0%, rgba(62, 98, 74, 0.22) 45%, rgba(40, 70, 52, 0) 100%); }
/* One axis: the logo and both lines of the headline share one centre line. The logo leads; the headline is sized
   from the logo's width so "Your command." is a little narrower than "CITY ARENA" at every screen size. */
.stage-group { --logo-w: clamp(250px, 27vw, 480px); position: relative; justify-self: center; width: var(--logo-w); display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: calc(var(--logo-w) * 0.13); text-align: center; animation: stage-in 480ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.stage-logo { display: block; width: 100%; height: auto; filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.7)); }
.stage-group .stage-headline { font-size: calc(var(--logo-w) / 7.1); width: max-content; white-space: nowrap; }
.stage-headline { font-family: var(--display); font-size: clamp(40px, 4.4vw, 78px); font-weight: 700; letter-spacing: -0.03em; line-height: 1.04; color: #f5f3ee; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); }
.stage-headline span { display: block; background: linear-gradient(90deg, #22c55e 0%, #4ade80 55%, #a3e635 100%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 0 22px rgba(74, 222, 128, 0.25)); }
/* The panel and its framed card. */
.login-panel { display: grid; align-items: stretch; padding: clamp(32px, 9vh, 88px) clamp(24px, 3vw, 44px) clamp(32px, 9vh, 88px) 0; background: radial-gradient(70% 50% at 70% 0%, rgba(34, 197, 94, 0.07) 0%, rgba(34, 197, 94, 0) 70%), linear-gradient(180deg, #121517 0%, #0b0d0e 100%); }
.login-card { display: grid; place-items: center; padding: clamp(32px, 6vh, 64px) clamp(28px, 6vw, 120px); border: 1px solid rgba(255, 255, 255, 0.08); border-left: 0; border-radius: 0 22px 22px 0; background: linear-gradient(160deg, rgba(34, 197, 94, 0.06) 0%, rgba(34, 197, 94, 0) 35%), linear-gradient(180deg, #171b1d 0%, #111416 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 30px 60px -30px rgba(0, 0, 0, 0.8); }
.login-form { width: min(530px, 100%); animation: stage-in 480ms 80ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }
.login-title { font-family: var(--display); font-size: clamp(32px, 2.7vw, 46px); font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; color: #f5f3ee; }
.login-sub { margin: 10px 0 clamp(24px, 4.5vh, 44px); font-size: clamp(16px, 1.25vw, 21px); line-height: 1.45; color: #a3a6a8; }
.login-field { gap: 10px; margin-bottom: clamp(18px, 3vh, 26px); }
.login-field label { font-size: clamp(15px, 1.05vw, 18px); font-weight: 500; color: #c9cbcc; }
.input-wrap { position: relative; }
.input-wrap input { min-height: clamp(54px, 7.4vh, 68px); padding: 0 18px 0 clamp(52px, 4vw, 66px); font-size: clamp(16px, 1.1vw, 19px); color: #f5f3ee; border: 1px solid rgba(255, 255, 255, 0.16); border-radius: 11px; background: #0a0c0d; box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5); }
.input-wrap input:hover { border-color: rgba(255, 255, 255, 0.24); }
.input-wrap input#password { padding-right: 62px; }
.input-wrap input:focus-visible { outline: none; border-color: rgba(34, 197, 94, 0.65); box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(34, 197, 94, 0.14); }
.input-icon { position: absolute; left: clamp(18px, 1.5vw, 24px); top: 0; bottom: 0; display: flex; align-items: center; color: #b9bcbe; pointer-events: none; transition: color var(--ease); }
.input-icon svg { width: clamp(20px, 1.6vw, 26px); height: clamp(20px, 1.6vw, 26px); stroke-width: 1.5; }
.input-wrap:focus-within .input-icon { color: #4ade80; }
.input-toggle { position: absolute; right: 8px; top: 8px; bottom: 8px; width: 46px; display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; color: #b9bcbe; cursor: pointer; transition: color var(--ease), background var(--ease); }
.input-toggle:hover { color: #f5f3ee; background: rgba(255, 255, 255, 0.06); }
.input-toggle[aria-pressed=true] { color: #4ade80; }
.input-toggle svg { width: 22px; height: 22px; stroke-width: 1.6; }
.login-submit { position: relative; width: 100%; min-height: clamp(56px, 8vh, 72px); margin-top: clamp(8px, 1.5vh, 14px); display: flex; align-items: center; justify-content: center; gap: 14px; border: 1px solid #3ee07a; border-radius: 11px;
  background: linear-gradient(180deg, #23c45d 0%, #169947 100%); color: #ffffff; font: 600 clamp(17px, 1.3vw, 21px)/1 var(--display); letter-spacing: 0.01em; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 14px 34px -12px rgba(34, 197, 94, 0.45), 0 2px 4px rgba(0, 0, 0, 0.5); transition: filter var(--ease), transform var(--ease), box-shadow var(--ease); }
.login-submit:hover:not(:disabled) { filter: brightness(1.08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 18px 40px -12px rgba(34, 197, 94, 0.55), 0 2px 4px rgba(0, 0, 0, 0.5); }
.login-submit:active:not(:disabled) { transform: translateY(1px); }
.login-submit:focus-visible { outline: 2px solid rgba(74, 222, 128, 0.7); outline-offset: 3px; }
.login-submit:disabled { cursor: progress; }
.login-submit.loading::before { content: ""; width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #ffffff; border-radius: 50%; animation: spin 0.7s linear infinite; }
.login-arrow { display: inline-flex; transition: transform var(--ease); }
.login-arrow svg { width: 24px; height: 24px; stroke-width: 1.8; }
.login-submit:hover:not(:disabled) .login-arrow { transform: translateX(4px); }
.login-submit.loading .login-arrow { display: none; }
.login-error { min-height: 20px; margin-top: 14px; font-size: 14px; line-height: 1.5; color: #f08b88; }
.login-error:empty { margin-top: 0; min-height: 0; }
.login.refused .input-wrap input { border-color: rgba(240, 139, 136, 0.55); }
/* The footer: centred between two hairlines. */
.login-foot { display: flex; align-items: center; gap: 22px; margin-top: clamp(28px, 6vh, 64px); font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #8d9193; white-space: nowrap; }
.login-foot::before, .login-foot::after { content: ""; flex: 1; height: 1px; background: rgba(255, 255, 255, 0.1); }
@keyframes stage-in { from { opacity: 0; transform: translateY(10px); } }
@media (max-width: 1180px) {
  .login { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .login-stage { padding: 48px 44px; }
  .login-card { padding: 40px 36px; }
}

/* ---------- Motion ---------- */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -120% 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(0.98); } }
@keyframes sheet-in { from { opacity: 0; transform: translateX(20px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Narrower desktop windows ---------- */
@media (max-width: 1180px) {
  .counter { grid-template-columns: minmax(0, 1fr); }
  .rep-top { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rep-lead { grid-column: 1 / -1; }
  .rep-main { grid-template-columns: minmax(0, 1fr); }
  .till { position: static; }
}

/* ---------- Phone ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .side { display: none; }
  main { padding: 0 16px 24px; }
  .top { min-height: 62px; }
  .top h1 { font-size: 21px; }
  .sync span { display: none; }
  .sync { padding: 0 10px; }
  .sync.stale span, .sync.saving span { display: inline; }
  .tabbar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-top: 1px solid var(--line); background: linear-gradient(180deg, #121418 0%, #0c0d10 100%); padding: 4px 6px env(safe-area-inset-bottom); }
  .tabbar button { position: relative; display: grid; justify-items: center; gap: 3px; padding: 8px 2px 7px; min-height: 56px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-3); font-size: 13px; font-weight: 500; cursor: pointer; transition: color var(--ease); }
  .tabbar button.on { color: var(--ink); font-weight: 600; }
  .tabbar button.on svg { color: var(--accent); }
  .tabbar button.on::before { content: ""; position: absolute; top: -4px; left: 50%; width: 24px; height: 3px; margin-left: -12px; border-radius: 0 0 3px 3px; background: var(--accent); }
  .tabbar svg { width: 21px; height: 21px; }
  .cats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; min-height: calc(100dvh - 170px); }
  .cats .cat, .cats .cat:nth-child(-n+2) { grid-column: auto; }
  .cats .cat:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .cat { padding: 18px 16px; gap: 14px; }
  .cat-name { font-size: 26px; }
  .cat-line { font-size: 14px; }
  .cat .glyph.lg { width: 46px; height: 46px; border-radius: 13px; }
  .cat .glyph.lg svg { width: 23px; height: 23px; }
  .floor-summary { padding: 12px; gap: 12px; }
  .tallies { width: 100%; }
  .tally { flex: 1; min-width: 0; padding: 8px 10px; }
  .stations { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .rep-top, .rep-main, .rep-charts { grid-template-columns: minmax(0, 1fr); gap: 12px; margin-bottom: 12px; }
  .rep-card { padding: 18px; }
  .rep-big { font-size: 38px; }
  .rep-chart-body { grid-template-columns: 140px minmax(0, 1fr); gap: 18px; }
  .rep-ring { width: 140px; height: 140px; }
  .rep-ring-centre b { font-size: 17px; }
  .rep-close { grid-template-columns: 38px minmax(0, 1fr); grid-template-areas: "icon main" "action action"; }
  .panel { padding: 16px; }
  .list th, .list td { padding-left: 14px; padding-right: 14px; }
  .sheet { width: 100vw; border-left: 0; }
  .sheet-head { padding: 16px 10px 14px 18px; }
  .sheet-body { padding: 18px; }
  .sheet-status { margin: 0 18px 12px; }
  .sheet-foot { padding: 14px 18px 18px; }
  .btn { min-height: 46px; }
  .btn.quiet { min-height: 40px; }
  .station { padding: 14px; }
  .station-actions .btn { min-height: 44px; }
  .slot { min-height: 50px; gap: 8px; padding-left: 10px; }
  .slot .icon-btn { width: 34px; height: 34px; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
  .table-wrap { overflow-x: auto; }
  /* Reservations become small cards: who and status on top, the time and Check In beneath. */
  .table-wrap:has(.list.res) { overflow: visible; }
  .list.res, .list.res tbody { display: block; }
  .list.res thead { display: none; }
  .list.res tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "who status" "when tools"; align-items: center; gap: 10px 12px; padding: 14px; border-bottom: 1px solid var(--line); }
  .list.res tr:last-child { border-bottom: 0; }
  .list.res td { padding: 0; border: 0; }
  .list.res td:nth-child(1) { grid-area: when; color: var(--ink-2); }
  .list.res td:nth-child(2) { grid-area: who; }
  .list.res td:nth-child(4) { grid-area: status; justify-self: end; }
  .list.res td:nth-child(5) { grid-area: tools; justify-self: end; }
  .list .hide-s { display: none; }
  .list .btn { min-height: 40px; }
  .row-tools .icon-btn { width: 40px; height: 40px; }
  .turf-board { grid-template-columns: 50px repeat(2, minmax(0, 1fr)); gap: 5px; padding: 10px; }
  .turf-hour { padding-right: 2px; }
  .turf-hour.now::before { display: none; }
  .turf-court-head { padding: 0 6px; font-size: 14px; }
  .turf-block { padding: 6px 8px; }
  .turf-day-word .muted { display: none; }
  .page-bar .desk-only { display: none; }
  /* A player's tools move under the name on a phone. */
  .turf-player { grid-template-columns: auto minmax(0, 1fr) auto; row-gap: 8px; }
  .turf-player-tools { grid-column: 1 / -1; justify-content: flex-end; gap: 6px; }
  .turf-player-tools .turf-pay { flex: 1; display: grid; grid-template-columns: 1fr 1fr auto; }
  .turf-player.cleared { grid-template-columns: auto minmax(0, 1fr) auto auto; }
  .turf-player.cleared .turf-player-tools { grid-column: auto; gap: 2px; }
  .page-bar .turf-day { order: 5; flex-basis: 100%; justify-content: space-between; }
  .row-tools .btn { padding: 0 11px; }
  /* A phone or a tablet upright: the lounge becomes the backdrop of the top, with the logo; the form below. */
  .login { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; background: #0b0d0e; }
  .login-stage { padding: 34px 20px 30px; place-items: center; }
  .stage-group { justify-self: center; width: auto; justify-items: center; gap: 0; }
  .stage-logo { width: min(200px, 54vw); }
  .stage-headline { display: none; }
  .login-panel { padding: 0; background: transparent; }
  .login-card { padding: 28px 20px 30px; border: 0; border-radius: 0; background: transparent; box-shadow: none; place-items: start center; }
  .login-title { font-size: 28px; text-align: center; }
  .login-sub { margin: 8px 0 26px; text-align: center; font-size: 16px; }
  .login-foot { margin-top: 30px; }
  .more-list { display: grid; gap: 8px; }
}

/* ---------- Printed receipt: black on white, receipt only ---------- */
#printArea { display: none; }
@media print {
  @page { margin: 6mm; }
  body { display: block; background: #fff; color: #000; overflow: visible; height: auto; }
  body > * { display: none !important; }
  body > #printArea { display: block !important; width: 72mm; margin: 0 auto; font: 11.5px/1.45 "Segoe UI", Arial, sans-serif; color: #000; }
  #printArea .wordmark { font-size: 15px; font-weight: 700; letter-spacing: 0.3em; text-align: center; padding: 0; margin-right: -0.3em; }
  #printArea .p-center { text-align: center; }
  #printArea .p-small { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; }
  #printArea .p-head { font-weight: 700; margin-top: 6px; }
  #printArea .p-row { display: flex; justify-content: space-between; gap: 10px; }
  #printArea .p-row span:last-child { white-space: nowrap; font-variant-numeric: tabular-nums; }
  #printArea .p-sub { color: #333; font-size: 10.5px; padding-left: 8px; }
  #printArea .p-rule { border-top: 1px solid #000; margin: 7px 0; }
  #printArea .p-dash { border-top: 1px dashed #666; margin: 6px 0; }
  #printArea .p-strong { font-weight: 700; font-size: 14px; }
}

/* A tablet upright: the form at a comfortable width under the lounge. */
@media (min-width: 600px) and (max-width: 900px) {
  .login-stage { padding: 56px 20px 44px; }
  .stage-logo { width: 240px; }
}
</style>

<script>
/* ENGINES_START */
/* Pure business rules used by the real Apps Script verification backend. */
var ArenaCore = (function () {
  'use strict';
  var rates = { PC: [5000,10000,18000,20000], PS5: [2000,3000,5000,6000], RC: [10000,10000,15000,20000], Pool: [3000,6000,8000,10000], Snooker: [5000,10000,15000,18000] };
  // Every business-rule message is written for the receptionist, so it is marked safe to show.
  function check(ok, message) {
    if (ok) return;
    var error = new Error(message);
    error.userFacing = true;
    throw error;
  }
  var OLD_START_MS = 6 * 3600000;
  // A start time is never in the future. One that is hours old is usually a wrong date, so it needs a deliberate yes.
  function startTime(value, now, confirmed) {
    var t = value == null ? now : value;
    check(Number.isSafeInteger(t) && t > 0 && t <= now, 'Invalid timestamp. Use a past or current time.');
    check(now - t <= OLD_START_MS || confirmed === true, 'Time warning: this start time is more than 6 hours ago. Check the date, then confirm to continue.');
    return t;
  }
  // Time a timer spent paused, up to a moment. Paused time is never billed.
  function pausedMs(state, segment, until) {
    var total = 0;
    (state.Pauses || []).forEach(function (p) {
      if (p.segmentId !== segment.id) return;
      var from = Math.max(p.startMs, segment.startMs), to = Math.min(p.endMs || until, until);
      if (to > from) total += to - from;
    });
    return total;
  }
  // The charge for a segment up to a moment: time played, with pauses taken out, at its saved rates.
  function charge(state, segment, end) {
    check(Number.isSafeInteger(end) && end > segment.startMs, 'End time must be after start time.');
    var paused = pausedMs(state, segment, end), played = Math.max(1, end - segment.startMs - paused);
    var result = bill(segment.startMs, segment.startMs + played, JSON.parse(segment.ratesJson));
    result.pausedMilliseconds = paused;
    return result;
  }
  // One place decides which rule engine owns a command, for the backend and the local preview alike.
  function engineFor(type) {
    var engines = [
      typeof ArenaCorrections !== 'undefined' ? ArenaCorrections : null,
      typeof ArenaPauses !== 'undefined' ? ArenaPauses : null,
      typeof ArenaCustomers !== 'undefined' ? ArenaCustomers : null,
      typeof ArenaReports !== 'undefined' ? ArenaReports : null,
      typeof ArenaCredits !== 'undefined' ? ArenaCredits : null,
      typeof ArenaSales !== 'undefined' ? ArenaSales : null,
      typeof ArenaReservations !== 'undefined' ? ArenaReservations : null,
      typeof ArenaTurf !== 'undefined' ? ArenaTurf : null,
      typeof ArenaApp !== 'undefined' ? ArenaApp : null
    ];
    for (var i = 0; i < engines.length; i++) if (engines[i] && engines[i].handles(type)) return engines[i];
    return ArenaCore;
  }
  // Every save goes through here. A move (to credit, to someone's bill, to a system or a turf booking) may carry a short
  // comment; it is kept once, with every bill, tab, account and booking the move touched, so it shows wherever they are opened.
  var NOTE_KEYS = ['tabId', 'sourceTabId', 'memberTabId', 'billId', 'accountId', 'toId', 'bookingId', 'id', 'tabIds'];
  function run(state, cmd, actor, now, operationId) {
    var note = cmd && cmd.note != null ? String(cmd.note).trim() : '';
    check(note.length <= 300, 'Keep the comment under 300 characters.');
    var result = engineFor(cmd.type).execute(state, cmd, actor, now, operationId);
    if (note) {
      var refs = [];
      [cmd, result || {}].forEach(function (source) {
        NOTE_KEYS.forEach(function (key) {
          [].concat(source[key] || []).forEach(function (value) { if (typeof value === 'string' && value && refs.indexOf(value) < 0) refs.push(value); });
        });
      });
      state.Notes = state.Notes || [];
      state.Notes.push({ id: operationId, kind: cmd.type, text: note, refsJson: JSON.stringify(refs), createdMs: now });
    }
    return result;
  }
  // A bill whose balance went on to a later turf booking: what it still showed as owing is owed there now.
  function carryOf(state, billId) {
    return (state.Carries || []).find(function (c) { return c.billId === billId; }) || null;
  }
  // A fresh start after trying the app out: every record goes; the venue's setup stays (stations, rates and settings,
  // festival dates) and, if asked, the menu. Bill and receipt numbers start again at CA-0001 and RC-0001.
  function freshStart(state, keepMenu) {
    var out = {};
    Object.keys(state).forEach(function (name) { out[name] = []; });
    out.Equipment = (state.Equipment || []).slice();
    out.Settings = (state.Settings || []).filter(function (r) { return String(r.id).indexOf('counter-') !== 0; });
    if (keepMenu) out.Products = (state.Products || []).slice();
    return out;
  }
  // A voided bill keeps its rows; the Corrections table says it no longer counts.
  function isVoidedBill(state, billId) {
    return (state.Corrections || []).some(function (c) { return c.kind === 'bill_void' && c.targetId === billId; });
  }
  // Human references (CA-0001 for bills, RC-0001 for receipts). Counters live in Settings; the link lives in References.
  function nextNumber(state, kind, id, now) {
    state.Settings = state.Settings || [];
    state.References = state.References || [];

/* Customer registry. One record per person, found again by mobile number or, failing that, by name. */
var ArenaCustomers = (function () {
  'use strict';
  var types = ['SAVE_CUSTOMER'];

  function check(ok, message) { ArenaCore.check(ok, message); }
  function digits(phone) { return String(phone || '').replace(/\D/g, ''); }
  function nameKey(name) { return String(name || '').trim().toLowerCase().replace(/\s+/g, ' '); }

  // A mobile number identifies a person. Without one, an exact name match on a record that has no number is reused.
  function match(state, name, phone) {
    var list = state.Customers || [], wanted = digits(phone);
    if (wanted) {
      var byPhone = list.find(function (c) { return digits(c.phone) === wanted; });
      if (byPhone) return byPhone;
    }
    return list.find(function (c) { return nameKey(c.name) === nameKey(name) && (!wanted || !digits(c.phone)); }) || null;
  }

  // Called when a visit, Quick Sale or reservation is saved: reuse the customer or register them.
  function touch(state, name, phone, now, id) {
    state.Customers = state.Customers || [];
    if (!nameKey(name)) return null;
    var found = match(state, name, phone);
    if (found) {
      found.lastSeenMs = now;
      found.visits = Number(found.visits || 0) + 1;
      if (!found.phone && phone) found.phone = String(phone).trim();
      found.revision = Number(found.revision || 1) + 1;
      return found;
    }
    var created = { id: id, name: String(name).trim(), phone: String(phone || '').trim(), createdMs: now, lastSeenMs: now, visits: 1, notes: '', revision: 1 };
    state.Customers.push(created);
    return created;
  }

  function execute(state, cmd, actor, now, id) {
    check(actor && actor.role === 'owner', 'Access denied.');
    check(cmd.type === 'SAVE_CUSTOMER', 'Unsupported operation.');
    state.Customers = state.Customers || [];
    var name = String(cmd.name || '').trim(), phone = String(cmd.phone || '').trim(), notes = String(cmd.notes || '').trim();
    check(name.length > 0 && name.length <= 80, 'Enter the customer name.');
    check(phone.length <= 30 && notes.length <= 300, 'Invalid customer details.');
    var existing = cmd.id ? state.Customers.find(function (c) { return c.id === cmd.id; }) : null;
    check(!cmd.id || !!existing, 'Record not found.');
    if (existing) check(cmd.revision === existing.revision, 'This customer changed on another device. Refresh before editing.');
    var clash = digits(phone) && state.Customers.find(function (c) { return digits(c.phone) === digits(phone) && (!existing || c.id !== existing.id); });
    check(!clash, 'This mobile number already belongs to ' + (clash ? clash.name : 'another customer') + '.');
    if (existing) {
      existing.name = name; existing.phone = phone; existing.notes = notes; existing.revision = existing.revision + 1;
      return { customerId: existing.id, message: 'Customer updated.' };
    }
    check(!match(state, name, phone), 'This customer is already registered.');
    state.Customers.push({ id: id, name: name, phone: phone, createdMs: now, lastSeenMs: '', visits: 0, notes: notes, revision: 1 });
    return { customerId: id, message: 'Customer added.' };
  }

  /* Where a booking's money stands, worked out on the server for the screen. Each bill of the booking (the booking's own,

          entry.billId = bill.id;

  }

  // Bookings still held from yesterday onwards travel with the live snapshot, with their players; older days are fetched on request.
  function live(state, now) {
    var from = dateKeyOf(now - DAY_MS);
    return booked(state).filter(function (b) { return b.dateKey >= from; });
  }
  function livePlayers(state, now) {
    var ids = {};
    live(state, now).forEach(function (b) { ids[b.id] = true; });
    return (state.TurfPlayers || []).filter(function (p) { return ids[p.bookingId] && p.status === 'active'; });
  }

  }

  /* One-time move from the old turf app's sheet (one row per hour: id, date, slot "18-19", name, phone, court, sport,

const ARENA_API = "https://script.google.com/macros/s/AKfycbwoZOVuZ6rp7gDVmMdqrOx16x3jj0iddMGqTiT-Qd8AVaZXhMY9VsED-R-GvsrW-mjp/exec";

    const id = ++seq;

const tabTotal = tabId => segmentsOf(tabId).concat(ordersOf(tabId)).reduce((sum, line) => sum + line.totalPaise, 0);
const stillPlaying = tabId => state.Segments.some(g => g.tabId === tabId && g.status === 'active');
// A PS5 player is "Controller 3", with a name beside it only when one was typed for that controller.
const isNamed = g => !/^Controller \d$/.test(g.player);
const controllerLabel = g => (g.controller ? 'Controller ' + g.controller + (isNamed(g) ? ' · ' + g.player : '') : g.player);
// "Controller 4" with the player's name as a small tag beside it, when one was given.
const controllerNode = g => [h('span', { text: 'Controller ' + g.controller }), isNamed(g) ? h('span', { class: 'tag', text: g.player }) : null];
// The names of the groups playing on a unit, shown once above their controllers.
const groupNames = segments => [...new Set(segments.map(g => (tabOf(g.tabId) || {}).customer).filter(Boolean))].join(' + ');
// "End 2 Controllers": the button always says how many it will stop.
const endLabel = count => (count ? 'End ' + count + (count === 1 ? ' Controller' : ' Controllers') : 'Select Controllers');
function categoryCounts(category) {
  const units = state.Equipment.filter(u => u.category === category);
  return { total: units.length, free: units.filter(u => !inUse(u)).length };
}

// ---------- Timers: saved start time, counted locally; paused time is left out ----------
// What a timer needs to know about pauses: time already spent paused, and when the current pause began (0 if running).
function pauseState(segment) {
  let total = 0, since = 0;
  for (const p of state.Pauses || []) {
    if (p.segmentId !== segment.id) continue;
    if (p.endMs) total += Math.max(0, p.endMs - Math.max(p.startMs, segment.startMs)); else since = p.startMs;
  }
  return { total, since };
}
// timer(segment) for a gaming timer; timer(startMs) for anything that cannot be paused.
function timer(source, small) {
  const segment = typeof source === 'object' ? source : null, start = segment ? segment.startMs : source, paused = segment ? pauseState(segment) : { total: 0, since: 0 };
  return h('span', { class: 'timer' + (small ? ' small' : '') + (paused.since ? ' held' : ''), data: { start: String(start), paused: String(paused.total), since: paused.since ? String(paused.since) : '' } },
    h('span'), h('i', { text: ':' }), h('span'), h('i', { text: ':' }), h('span'));
}
function tick() {
  // A reminder whose time has come: its station, its chip, its category and the menu entry start to blink.
  const now = nowMs();
  for (const node of document.querySelectorAll('[data-due]')) node.classList.toggle('due', now >= Number(node.dataset.due));
  for (const node of document.querySelectorAll('[data-start]')) {
    const until = node.dataset.since ? Number(node.dataset.since) : nowMs();
    const seconds = Math.max(0, Math.floor((until - Number(node.dataset.start) - Number(node.dataset.paused || 0)) / 1000));
    const parts = [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60];
    [0, 2, 4].forEach((child, i) => { node.children[child].textContent = String(parts[i]).padStart(2, '0'); });
  }
}
// Pauses the running timers given, or resumes them all if all are paused.
function togglePause(segments) {
  const running = segments.filter(g => !pauseState(g).since), paused = segments.length > 0 && !running.length;
  runCommand(paused ? { type: 'RESUME_SEGMENTS', segmentIds: segments.map(g => g.id) } : { type: 'PAUSE_SEGMENTS', segmentIds: running.map(g => g.id) }, () => {});
}
const allPaused = segments => segments.length > 0 && segments.every(g => pauseState(g).since);
// One tap pauses, the next resumes.
function pauseButton(segments, label) {
  const paused = allPaused(segments);
  return iconButton(paused ? 'play' : 'pause', (paused ? 'Resume ' : 'Pause ') + label, () => togglePause(segments), { class: paused ? 'on' : '', data: { action: paused ? 'resume' : 'pause' } });
}

// ---------- Bookings: would starting this unit leave a booking in the next hour without a place? ----------
// The same rule as the server (Reservations.gs), so the warning shows as soon as the station is opened rather than after
// the form is filled in. The server still checks every start; this only says it earlier and in plain words.
const BOOKING_STALE_MS = 4 * 3600000;
function bookingsWithoutPlace(category, taken, exclude) {
  const now = nowMs(), until = now + settingValue('reservationHorizonMinutes', 60) * 60000;
  const free = state.Equipment.filter(u => u.category === category && u.id !== taken && !inUse(u)).map(u => u.id);
  const due = state.Reservations.filter(r => r.id !== exclude && r.category === category && RES_PENDING.includes(r.status) && r.arrivalMs <= until && r.arrivalMs >= now - BOOKING_STALE_MS)
    .sort((a, b) => a.arrivalMs - b.arrivalMs);
  const claimed = new Set(), left = [], open = [];
  for (const r of due) {
    if (r.unitId) { if (claimed.has(r.unitId) || !free.includes(r.unitId)) left.push(r); claimed.add(r.unitId); }
    else open.push(r);
  }
  return left.concat(open.slice(free.filter(id => !claimed.has(id)).length));
}
// Only a clash this start causes: one that is there whichever unit is used is not this unit's to warn about.
function bookingClash(unit, exclude = '') {
  if (inUse(unit)) return [];
  const before = new Set(bookingsWithoutPlace(unit.category, '', exclude));
  return bookingsWithoutPlace(unit.category, unit.id, exclude).filter(r => !before.has(r));
}
// The warning at the top of a start sheet, with a box to go ahead anyway.
function clashNotice(unit, clashes, acked, onTick) {
  const lines = clashes.map(r => r.unitId === unit.id
    ? r.customer + ' has booked ' + unit.name + ' for ' + clock(r.arrivalMs) + '.'
    : r.customer + ' has booked a ' + unit.category + ' for ' + clock(r.arrivalMs) + '. Using ' + unit.name + ' leaves no ' + unit.category + ' free for them.');
  const box = h('input', { type: 'checkbox', checked: acked, data: { field: 'booking-ack' }, onchange: () => onTick(box.checked) });
  return h('div', 'clash', icon('reservations'), h('div', 'clash-main', h('b', { text: clashes.length === 1 ? 'Booked soon' : clashes.length + ' bookings soon' }),
    lines.map(text => h('span', { class: 'small', text })), h('label', 'clash-ack', box, h('span', { text: 'Use ' + unit.name + ' anyway' }))));
}

// ---------- Paid in advance and reminders, as shown on a station ----------
const heldFor = tabIds => (state.Advances || []).filter(a => a.status === 'held' && tabIds.includes(a.tabId)).reduce((sum, a) => sum + a.amountPaise, 0);
const reminderOf = unitId => (state.Reminders || []).find(r => r.unitId === unitId) || null;
// The bill a station's extras belong to: a console's group bill, otherwise the one bill on it.
function billOn(unit) { const tabs = [...new Set(activeOn(unit.id).map(g => g.tabId))].map(tabOf).filter(Boolean); return tabs.find(t => t.kind === 'group') || tabs[0]; }
function stationExtras(unit) {
  const tabIds = [...new Set(activeOn(unit.id).map(g => g.tabId))], paid = heldFor(tabIds), reminder = reminderOf(unit.id);
  return [
    paid ? h('span', { class: 'chip-paid', title: 'Paid in advance', data: { paid: unit.id } }, icon('wallet'), money(paid)) : null,
    // Before its time the chip says when; once due it says so, and one tap clears it.
    reminder ? h('button', { type: 'button', class: 'remind', title: 'Reminder', data: { due: String(reminder.dueMs), action: 'reminder' },
      onclick: () => (nowMs() >= reminder.dueMs ? runCommand({ type: 'CLEAR_REMINDER', unitId: unit.id }, () => {}) : reminderSheet(unit)) },
    icon('bell'), h('span', { class: 'when', text: clock(reminder.dueMs) }), h('span', { class: 'up', text: 'Time up · Done' })) : null
  ];
}
function extraItems(unit) {
  return [['Paid in advance', () => advanceSheet(billOn(unit)), false, 'wallet'], [reminderOf(unit.id) ? 'Change reminder' : 'Set reminder', () => reminderSheet(unit), false, 'bell']];
}

// ---------- Gaming floor ----------
let floorCategory = null;
// Active controllers start selected; a deliberate untick survives every refresh.
const unpicked = new Set();

function floorBar(bar) {
  if (!floorCategory) return;
  bar.append(btn([icon('back'), 'All'], () => { floorCategory = null; render(); }, 'quiet', { data: { floor: 'home' } }));
  for (const category of CATEGORIES) {
    const c = categoryCounts(category);
    bar.append(h('button', { type: 'button', class: 'chip', 'aria-pressed': String(category === floorCategory), data: { category }, onclick: () => { floorCategory = category; render(); } },
      icon(category), h('span', { text: catName(category) }), h('span', { class: 'num', text: c.free + '/' + c.total })));
  }
}

// A row of small bars, one per unit or controller; the filled ones are in use.
function meter(used, total) {
  const bars = [];
  for (let n = 0; n < total; n++) bars.push(h('i', n < used ? 'on' : ''));
  return h('span', { class: 'meter', 'aria-hidden': 'true' }, bars);
}

// ---------- Home: the four systems, nothing else ----------
function categoryTile(category) {
  const c = categoryCounts(category), busy = c.total - c.free, live = busy > 0;
  const line = c.free === 0
    ? h('div', { class: 'cat-line full', text: 'Full' })
    : h('div', 'cat-line', h('b', { text: String(c.free) }), ' of ' + c.total + ' available');
  const due = (state.Reminders || []).filter(r => (unitOf(r.unitId) || {}).category === category).map(r => r.dueMs);
  return h('button', { type: 'button', class: 'cat' + (live ? ' live' : ''), data: { category, ...(due.length ? { due: String(Math.min(...due)) } : {}) }, onclick: () => { floorCategory = category; render(); } },
    h('span', 'cat-top', glyph(category, live ? 'jade' : '', 'lg'), h('span', 'cat-open', icon('right'))),
    h('span', 'cat-body', h('span', { class: 'cat-name', text: catName(category) }), line),
    meter(busy, c.total));
}

// ---------- Top of a category: how many are free and in use, and every unit at a glance ----------
// A PS5 pill also shows its controllers: four small bars and "3/4". A pill jumps to its card.
function floorSummary(category) {
  const units = state.Equipment.filter(u => u.category === category), busy = units.filter(inUse), ps5 = category === 'PS5';
  const tally = (key, value, label, tone = '') => h('div', { class: ('tally ' + tone).trim(), data: { tally: key } }, h('b', { class: 'num', text: String(value) }), h('span', { text: label }));
  const tallies = [tally('free', units.length - busy.length, 'Free'), tally('busy', busy.length, 'In use', busy.length ? 'live' : '')];
  if (ps5) {
    const seats = units.reduce((sum, u) => sum + activeOn(u.id).length, 0);
    tallies.push(tally('controllers', seats, seats === 1 ? 'Controller' : 'Controllers', seats ? 'live' : ''));
  }
  const jump = id => { const card = document.querySelector('.station[data-unit="' + id + '"]'); if (card) card.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); };
  const pills = units.map(unit => {
    const players = activeOn(unit.id), used = inUse(unit), held = used && allPaused(players);
    const says = unit.name + (used ? (held ? ' · paused' : ' · in use') : ' · free') + (ps5 && used ? ' · ' + players.length + ' of 4 controllers' : '');
    const reminder = reminderOf(unit.id);
    return h('button', { type: 'button', class: 'unit-pill' + (used ? (held ? ' held' : ' live') : ''), title: says, 'aria-label': says, data: { jump: unit.id, ...(reminder ? { due: String(reminder.dueMs) } : {}) }, onclick: () => jump(unit.id) },
      h('i'), h('span', { text: unit.name }),
      ps5 ? [meter(players.length, 4), h('span', { class: 'num', text: players.length + '/4' })] : null);
  });
  return h('section', 'floor-summary', h('div', 'tallies', tallies), h('div', 'unit-pills', pills));
}

// ---------- Station cards ----------
const STATE_TEXT = { free: 'Available', live: 'Live', held: 'Paused' };
function statePill(kind) { return h('span', { class: 'state ' + kind }, h('i'), STATE_TEXT[kind]); }
function stationHead(unit, tone, meta, ...tools) {
  return h('div', 'station-head', glyph(unit.category, tone), h('div', 'station-title', h('h3', { class: 'station-name', text: unit.name }), meta), h('div', 'station-tools', tools));
}
function whoRow(name, text, ...extras) { return h('div', 'who-row', icon(name), h('span', { class: 'station-who', text }), extras); }

// Corrections for one timer. The same two entries are offered on the floor and on the bill.
function sessionMenu(segment, extra = []) {
  return menu([
    ...extra,
    ['Correct time', () => correctTimeSheet(segment), false, 'clock'],
    ['Void session', () => voidSessionSheet(segment), true, 'ban']
  ], 'Options for ' + segment.player);
}

function stationCard(unit) {
  const players = activeOn(unit.id), legacy = legacyOn(unit.id), card = h('article', { class: 'station', data: { unit: unit.id } });

  if (!players.length && !legacy) {
    // A free station that someone has booked soon says so before it is opened.
    const booked = bookingClash(unit)[0];
    card.append(stationHead(unit, '', booked ? h('div', 'station-meta booked', icon('reservations'), h('span', { text: 'Booked ' + clock(booked.arrivalMs) })) : null, statePill('free')),
      btn([icon('play'), 'Start Session'], () => startSheet(unit), 'go block', { data: { action: 'start' } }));
    return card;
  }
  card.classList.add('live');

  if (legacy) {
    card.append(stationHead(unit, 'jade', null, statePill('live')), whoRow('user', legacy.customer),
      h('div', 'clock-panel', h('div', 'clock-main', timer(legacy.startMs), h('div', { class: 'small muted', text: 'Started ' + when(legacy.startMs) }))),
      btn([icon('stop'), 'End Session'], () => openSheet({
        title: 'End ' + unit.name, build: ui => { ui.primary('End'); },
        command: () => ({ type: 'BILL', sessionId: legacy.id }), then: result => receiptSheet(result.billId)
      }), 'tonal block'));
    return card;
  }

  // Tap anywhere on a station in use, away from its controls, to see what it comes to so far.
  card.classList.add('tap');
  const reminder = reminderOf(unit.id);
  if (reminder) card.dataset.due = String(reminder.dueMs);
  card.onclick = e => { if (!e.target.closest('button, input, label, .menu')) costSheet(unit); };
  const held = allPaused(players);
  if (held) card.classList.add('held');
  const tone = held ? 'warn' : 'jade', costItem = ['Cost so far', () => costSheet(unit), false, 'wallet'];

  if (unit.category === 'PS5') {
    const several = players.length > 1;
    card.append(stationHead(unit, tone,
      h('div', 'station-meta', meter(players.length, 4), h('span', { text: players.length + ' / 4 controllers' })),
      statePill(held ? 'held' : 'live'),
      menu([costItem, ...extraItems(unit), ...(several ? [[held ? 'Resume all' : 'Pause all', () => togglePause(players), false, held ? 'play' : 'pause']] : [])], 'Options for ' + unit.name)));
    card.append(whoRow(several ? 'users' : 'user', groupNames(players), stationExtras(unit)));

    const chosen = () => players.filter(g => !unpicked.has(g.id));
    const endText = h('span'), end = btn([icon('stop'), endText], () => endSheet(chosen()), 'tonal wide', { data: { action: 'end' } });
    const rows = new Map(), list = h('div', 'slots');
    const paint = () => {
      const count = chosen().length;
      endText.textContent = endLabel(count);
      end.disabled = !count;
      for (const [id, row] of rows) row.classList.toggle('picked', !unpicked.has(id));
    };
    for (const g of players) {
      const paused = !!pauseState(g).since;
      const box = h('input', { type: 'checkbox', checked: !unpicked.has(g.id), 'aria-label': 'Select ' + controllerLabel(g), data: { pick: g.id },
        onchange: () => { if (box.checked) unpicked.delete(g.id); else unpicked.add(g.id); paint(); } });
      // The whole row selects; the pause button and the menu keep their own taps.
      const row = h('label', { class: 'slot' + (paused ? ' held' : ''), title: controllerLabel(g) }, box,
        h('span', { class: 'seat', 'aria-hidden': 'true', text: String(g.controller) }),
        h('span', 'slot-who', h('b', null, controllerNode(g))),
        timer(g, true), pauseButton([g], controllerLabel(g)), sessionMenu(g));
      rows.set(g.id, row);
      list.append(row);
    }
    paint();
    const actions = h('div', 'station-actions', end);
    if (players.length < 4) actions.append(btn([icon('plusCircle'), 'Add Controllers'], () => addControllersSheet(unit), '', { data: { action: 'add-controllers' } }));
    actions.append(btn([icon('sales'), 'Add Items'], () => addItemsFor(unit), players.length < 4 ? '' : 'wide', { data: { action: 'items' } }));
    card.append(list, actions);
    return card;
  }

  const g = players[0], tab = tabOf(g.tabId), since = pauseState(g).since;
  card.append(
    stationHead(unit, tone, null, statePill(held ? 'held' : 'live'), sessionMenu(g, [costItem, ...extraItems(unit)])),
    whoRow('user', tab ? tab.customer : g.player, stationExtras(unit)),
    h('div', 'clock-panel',
      h('div', 'clock-main', timer(g), since ? h('div', { class: 'small warn-text', text: 'Paused at ' + clock(since) }) : h('div', { class: 'small muted', text: 'Started ' + when(g.startMs) })),
      pauseButton([g], unit.name)),
    h('div', 'station-actions',
      btn([icon('stop'), 'End Session'], () => endSheet([g]), 'tonal', { data: { action: 'end' } }),
      btn([icon('sales'), 'Add Items'], () => addItemsFor(unit), '', { data: { action: 'items' } })));
  return card;
}

function addItemsFor(unit) {
  const tabs = [...new Set(activeOn(unit.id).map(g => g.tabId))].map(tabOf).filter(Boolean);
  addItemsSheet(billOn(unit), { tabs, unit });
}

const floorPage = {
  title: 'Gaming floor',
  bar: floorBar,
  render(page) {
    if (!floorCategory) { page.append(h('div', 'cats', CATEGORIES.map(categoryTile))); return; }
    page.append(floorSummary(floorCategory), h('div', 'stations', state.Equipment.filter(u => u.category === floorCategory).map(stationCard)));
    tick();
  }
};

// ---------- Starting and adding ----------
// ---------- Optional extras when a session starts: money paid up front, and a reminder ----------
function advanceFields(initialMethod = 'cash') {
  const amount = h('input', { type: 'number', min: '0', step: '1', inputmode: 'decimal', 'aria-label': 'Paid in advance', data: { field: 'advance' } });
  const method = methodChoice(initialMethod);
  return {
    node: h('div', 'foot-row', field('Paid in advance (₹)', amount), method.node),
    amount,
    value() {
      if (amount.value === '') return null;
      const paise = toPaise(amount.value);
      if (!(paise > 0)) throw new Error('Enter the amount paid in advance, or leave it empty.');
      return { amountPaise: paise, method: method.value() };
    }
  };
}
// "Remind me": in 15, 30 or 45 minutes, in an hour, or at a time on the clock. from() is when the minutes count from.
function reminderPicker(from, label = 'Remind me') {
  let choice = '';
  const at = h('input', { type: 'time', 'aria-label': 'Remind at', data: { field: 'remind-at' }, hidden: true });
  const pick = segmented([['15', '15 min'], ['30', '30 min'], ['45', '45 min'], ['60', '1 hour'], ['at', 'At a time']], '', v => { choice = v; at.hidden = v !== 'at'; if (v === 'at') at.focus(); });
  pick.node.dataset.field = 'remind';
  return {
    node: h('div', 'field', h('span', { text: label }), pick.node, at),
    value() {
      if (!choice) return null;
      if (choice !== 'at') return from() + Number(choice) * 60000;
      if (!at.value) throw new Error('Choose the time for the reminder.');
      // A time already gone today means the same time tomorrow.
      let due = Date.parse(dayKey(nowMs()) + 'T' + at.value + ':00+05:30');
      if (due < nowMs() - 60000) due += 86400000;
      return due;
    }
  };
}
// The two optional rows, each opened by a quiet button so the sheet stays short when they are not wanted.
function startExtras(from) {
  const open = { advance: false, remind: false }, advance = advanceFields(), reminder = reminderPicker(from);
  return {
    draw(ui, links) {
      links.append(
        btn([icon('wallet'), 'Paid in advance'], () => { open.advance = !open.advance; ui.redraw(); if (open.advance) advance.amount.focus(); }, 'quiet', { data: { action: 'add-advance' }, 'aria-pressed': String(open.advance) }),
        btn([icon('bell'), 'Remind me'], () => { open.remind = !open.remind; ui.redraw(); }, 'quiet', { data: { action: 'add-reminder' }, 'aria-pressed': String(open.remind) }));
      if (open.advance) ui.body.append(advance.node);
      if (open.remind) ui.body.append(reminder.node);
    },
    value: () => ({ advance: open.advance ? advance.value() || undefined : undefined, remindAtMs: open.remind ? reminder.value() || undefined : undefined })
  };
}

function startSheet(unit) {
  const ps5 = unit.category === 'PS5', names = ['', '', '', ''];
  // Said as soon as the station is opened: would this start leave a booking in the next hour without a place?
  const clashes = bookingClash(unit);
  let who, count, time, naming = false, acked = false;
  const extras = startExtras(() => (time && time.value()) || nowMs());
  openSheet({
    title: 'Start ' + unit.name,
    icon: unit.category,
    build(ui) {
      if (clashes.length) ui.body.append(clashNotice(unit, clashes, acked, on => { acked = on; current.ack.reservation = on; if (current.primaryButton) current.primaryButton.disabled = !on; }));
      who = who || customerFields();
      ui.body.append(who.node);
      if (ps5) {
        // The name above is the group's. Players are Controller 1–4; a name for one of them is optional.
        count = segmented([[1, '1'], [2, '2'], [3, '3'], [4, '4']], count ? count.value() : 1, () => ui.redraw());
        ui.body.append(h('div', 'field', h('span', { text: 'Controllers' }), count.node));
      }
      const links = h('div', 'station-links');
      if (ps5) links.append(btn([icon('pencil'), naming ? 'Hide player names' : 'Name the players'], () => { naming = !naming; ui.redraw(); }, 'quiet', { data: { action: 'name-players' } }));
      ui.body.append(links);
      if (ps5 && naming) for (let n = 1; n <= Number(count.value()); n++) {
        const input = textInput({ value: names[n - 1], placeholder: 'Controller ' + n, 'aria-label': 'Name for controller ' + n, data: { playerName: String(n) } });
        input.oninput = () => { names[n - 1] = input.value; };
        ui.body.append(field('Controller ' + n + ' (optional)', input));
      }
      extras.draw(ui, links);
      time = time || timeChoice('Starts');
      ui.body.append(time.node);
      ui.primary('Start Session', clashes.length > 0 && !acked);
    },
    command() {
      if (!who.name.value.trim()) throw new Error(ps5 ? 'Enter the group or customer name.' : 'Enter the customer name.');
      const controllers = count ? Number(count.value()) : 1;
      return { type: 'OPEN_TAB', unitId: unit.id, customer: who.name.value.trim(), phone: who.phone.value.trim(), controllers, playerNames: ps5 && naming ? names.slice(0, controllers).map(v => v.trim()) : undefined, startMs: time.value(), ...extras.value() };
    },
    // Stay on the category so the new session is on screen.
    then() { closeSheet(); floorCategory = unit.category; go('floor'); }
  });
}

function addControllersSheet(unit) {
  const players = activeOn(unit.id), free = [1, 2, 3, 4].filter(n => !players.some(g => g.controller === n));
  const groups = [...new Set(players.map(g => g.groupId))];
  let group = groups[0];
  const rows = free.map(n => ({ n, on: false, name: textInput({ placeholder: 'Controller ' + n, 'aria-label': 'Name for controller ' + n }), time: null }));
  openSheet({
    title: 'Add controllers · ' + unit.name,
    icon: 'PS5',
    focus: false,
    build(ui) {
      if (groups.length > 1) {
        const choice = segmented(groups.map(id => [id, (tabOf(id) || {}).customer || 'Group']), group, v => { group = v; });
        ui.body.append(h('div', 'field', h('span', { text: 'Group' }), choice.node));
      }
      const primary = () => { const n = rows.filter(r => r.on).length; ui.foot.replaceChildren(); ui.primary(n ? 'Add ' + n + (n === 1 ? ' controller' : ' controllers') : 'Add controllers', !n); };
      for (const row of rows) {
        row.time = row.time || timeChoice('Starts');
        const extra = h('div', { hidden: !row.on }, field('Name (optional)', row.name), row.time.node);
        const box = h('input', { type: 'checkbox', checked: row.on, data: { addController: String(row.n) }, onchange: () => { row.on = box.checked; extra.hidden = !row.on; primary(); } });
        ui.body.append(h('label', 'check', box, h('span', { class: 'seat', 'aria-hidden': 'true', text: String(row.n) }), h('span', { text: 'Controller ' + row.n })), extra);
      }

      return { type: 'ADD_CONTROLLERS', unitId: unit.id, groupId: group, players: chosen.map(r => ({ controller: r.n, player: r.name.value.trim(), startMs: r.time.value() })) };
    }

}

// ---------- Menu picker: tap a tile to add one; the stepper appears on the tile ----------
function productPicker(onchange) {
  const products = state.Products.filter(p => p.available === 'yes'), cart = new Map();
  const grid = h('div', 'tiles');
  const first = PRODUCT_KINDS.find(k => products.some(p => p.category === k[0])) || PRODUCT_KINDS[0];
  const category = segmented(PRODUCT_KINDS, first[0], () => draw());
  function change(id, quantity) {
    if (quantity <= 0) cart.delete(id); else cart.set(id, Math.min(999, quantity));
    draw();
    if (onchange) onchange();
  }
  function draw() {
    grid.replaceChildren();
    const list = products.filter(p => p.category === category.value());
    if (!list.length) grid.append(h('p', { class: 'muted', text: 'Nothing in this category.' }));
    for (const p of list) {
      const quantity = cart.get(p.id) || 0;
      // Icon, name and price on top. The bottom row invites a first tap, then becomes the stepper; a tap anywhere else adds one more.
      const stepper = quantity ? h('span', 'step',
        h('button', { type: 'button', 'aria-label': 'One fewer ' + p.name, onclick: e => { e.stopPropagation(); change(p.id, quantity - 1); } }, icon('minus')),
        h('b', { text: String(quantity), data: { quantity: p.id } }),
        h('button', { type: 'button', 'aria-label': 'One more ' + p.name, onclick: e => { e.stopPropagation(); change(p.id, quantity + 1); } }, icon('plus'))) : h('span', 'tile-add', icon('plus'), 'Add');
      grid.append(h('div', { class: 'tile' + (quantity ? ' on' : ''), role: 'button', tabindex: '0', data: { product: p.id },
        onclick: () => change(p.id, quantity + 1), onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); change(p.id, quantity + 1); } } },
      h('span', 'tile-head', glyph(p.category === 'Snacks' ? 'snack' : 'drink', quantity ? 'jade' : ''), h('span', 'tile-text', h('span', { class: 'tile-name', text: p.name }), h('span', { class: 'tile-price', text: money(p.pricePaise) }))), stepper));
    }
  }
  draw();
  return {
    empty: !products.length,
    node: h('div', null, h('div', { class: 'field' }, category.node), grid),
    items: () => [...cart].map(([productId, quantity]) => ({ productId, quantity })),
    // What is in the basket, for showing it back: name, how many, and what that comes to.
    lines: () => [...cart].map(([id, quantity]) => { const p = products.find(p => p.id === id); return { name: p.name, quantity, unitPaise: p.pricePaise, totalPaise: p.pricePaise * quantity }; }),
    count: () => [...cart.values()].reduce((a, b) => a + b, 0),
    total: () => [...cart].reduce((sum, [id, quantity]) => sum + products.find(p => p.id === id).pricePaise * quantity, 0),
    clear() { cart.clear(); draw(); }
  };
}

// Snacks and drinks on a bill (not the turf fee or a balance carried in): only these can move or be named as unpaid.
const goodsOf = orders => orders.filter(o => o.category !== 'Turf' && o.category !== 'Carried');
// Items already on a bill, each with a stepper from none up to how many are on it. counts survives a redraw.
function itemChooser(orders, counts, onchange) {
  const node = h('div', 'lines');
  const draw = () => {
    node.replaceChildren(...orders.map(o => {
      const n = counts.get(o.id) || 0, most = Number(o.quantity);
      const set = value => { counts.set(o.id, Math.max(0, Math.min(most, value))); draw(); onchange(); };
      return h('div', { class: 'line', data: { pick: o.id } },
        h('div', 'line-main', h('b', { text: o.label }), h('span', { class: 'small muted', text: money(o.unitPricePaise) + ' each · ' + most + ' on the bill' })),
        h('span', 'step',
          h('button', { type: 'button', 'aria-label': 'One fewer ' + o.label, disabled: !n, onclick: () => set(n - 1) }, icon('minus')),
          h('b', { text: String(n), data: { picked: o.id } }),
          h('button', { type: 'button', 'aria-label': 'One more ' + o.label, disabled: n >= most, onclick: () => set(n + 1) }, icon('plus'))));
    }));
  };
  draw();
  return {
    node,
    items: () => orders.filter(o => counts.get(o.id)).map(o => ({ orderId: o.id, quantity: counts.get(o.id) })),
    count: () => orders.reduce((sum, o) => sum + (counts.get(o.id) || 0), 0),
    total: () => orders.reduce((sum, o) => sum + o.unitPricePaise * (counts.get(o.id) || 0), 0)
  };
}
// Players paying before the rest of their group take their share of the group's snacks and drinks with them.
function takeItemsSheet(tab, group) {
  const counts = new Map();

function addItemsSheet(tab, options = {}) {
  const tabs = options.tabs && options.tabs.length > 1 ? options.tabs : [tab];

    title: 'Add Items',

// ---------- Ending ----------
function endSheet(segments) {
  if (!segments.length) return;
  const unit = unitOf(segments[0].unitId);
  const ps5 = unit.category === 'PS5';
  const title = !ps5 ? 'End ' + unit.name : segments.length === 1 ? 'End Controller ' + segments[0].controller : 'End ' + segments.length + ' controllers';
  let time;
  openSheet({
    title,
    sub: ps5 ? groupNames(segments) : '',
    icon: unit.category,
    focus: false,
    build(ui) {
      // The same card as on the bill: the unit on top, then who is stopping.
      const card = h('div', 'lines');
      for (const g of segments) card.append(h('div', 'line', ps5 ? h('span', { class: 'seat', 'aria-hidden': 'true', text: String(g.controller) }) : null, h('div', 'line-main', h('b', null, ps5 ? controllerNode(g) : (tabOf(g.tabId) || {}).customer || g.player), h('span', { class: 'small muted', text: 'since ' + when(g.startMs) })), timer(g, true)));
      ui.body.append(h('div', 'group-title', icon(unit.category), unit.name), card);
      time = timeChoice('Ends');
      ui.body.append(h('div', { style: 'margin-top:16px' }, time.node));
      // Some of a group stop and the rest play on: settle these now, or leave their charge for the others to pay at the end.
      const ids = new Set(segments.map(g => g.id)), tabs = new Set(segments.map(g => g.tabId));
      const othersPlaying = state.Segments.some(g => g.status === 'active' && tabs.has(g.tabId) && !ids.has(g.id));
      ui.primary(othersPlaying ? 'End & Settle' : 'End Session');
      if (othersPlaying) ui.foot.append(btn([icon('users'), 'End · Others Will Pay'], () => runCommand({ type: 'END_SELECTION', segmentIds: segments.map(g => g.id), endMs: time.value(), keep: true },
        () => { for (const g of activeOn(unit.id)) unpicked.delete(g.id); closeSheet(); render(); }), 'block', { data: { action: 'end-keep' } }));
      tick();
    },
    command: () => ({ type: 'END_SELECTION', segmentIds: segments.map(g => g.id), endMs: time.value() }),
    // The players left on this unit go back to being selected by default.
    then(result) { for (const g of activeOn(unit.id)) unpicked.delete(g.id); render(); settleSheet(result.tabId); }
  });
}

// ---------- Credit account chooser, used when settling and when moving an existing bill ----------
function accountPicker(store) {
  const node = h('div');
