  const focus = () => { const first = node.querySelector('input'); if (first) first.focus({ preventScroll: true }); };
  function draw() {
    node.replaceChildren();
    const hasAccounts = state.CreditAccounts.length > 0;
    if (!hasAccounts) store.mode = 'new';
    if (hasAccounts) node.append(h('div', 'field', h('span', { text: 'Credit account' }), segmented([['existing', 'Existing'], ['new', 'New account']], store.mode, v => { store.mode = v; draw(); focus(); }).node));
    if (store.mode === 'new') {
      const name = textInput({ value: store.name, 'aria-label': 'Account name', data: { field: 'account-name' }, oninput: () => { store.name = name.value; } });
      const phone = h('input', { type: 'tel', value: store.phone, 'aria-label': 'Account mobile', oninput: () => { store.phone = phone.value; } });
      node.append(field(hasAccounts ? 'Account name' : 'New credit account name', name), field('Mobile (optional)', phone));
      return;
    }
    const search = h('input', { type: 'search', placeholder: 'Search accounts', value: store.search, 'aria-label': 'Search accounts' });
    const list = h('div', 'chips');
    const fill = () => {
      list.replaceChildren();
      for (const a of state.CreditAccounts.filter(a => a.name.toLowerCase().includes(search.value.trim().toLowerCase())).slice(0, 12))
        list.append(h('button', { type: 'button', class: 'chip', 'aria-pressed': String(store.id === a.id), onclick: () => { store.id = a.id; fill(); } }, a.name));
      if (!list.childElementCount) list.append(h('span', { class: 'muted small', text: 'No account with that name.' }));
    };
    search.oninput = () => { store.search = search.value; fill(); };
    fill();
    node.append(h('div', 'field', search), h('div', { class: 'field' }, list));
  }
  draw();
  return {
    node,
    focus,
    value() {
      if (store.mode === 'new') {
        if (!store.name.trim()) throw new Error('Enter the credit account name.');
        return { newAccount: { name: store.name.trim(), phone: store.phone.trim() } };
      }
      if (!store.id) throw new Error('Choose a credit account.');
      return { accountId: store.id };
    }
  };
}
const newAccountStore = () => ({ mode: 'existing', id: '', name: '', phone: '', search: '' });

// ---------- Settle: lines, discount, total and payment on one sheet ----------
// Charges are drawn as cards so it is plain what belongs together: one card per unit, with a PS5's controllers
// listed under their console, and one card for snacks and beverages.
// lines: { segments, orders, customer, tab (when editable), editable, detail (receipt: also show time played),
//          quotes (cost so far: what each running timer would bill if it stopped now) }
function drawLines(body, lines) {
  const { segments, orders, customer, tab, editable, detail } = lines, byUnit = new Map();
  for (const g of segments) { if (!byUnit.has(g.unitId)) byUnit.set(g.unitId, []); byUnit.get(g.unitId).push(g); }
  for (const [unitId, list] of byUnit) {
    const unit = unitOf(unitId), card = h('div', 'lines');
    for (const g of list) {
      const running = g.status === 'active', times = running ? 'Playing since ' + when(g.startMs) : period(g.startMs, g.endMs);
      const quote = running && lines.quotes ? lines.quotes[g.id] : null;
      const away = (lines.pauses || state.Pauses || []).filter(p => p.segmentId === g.id).reduce((sum, p) => sum + Math.max(0, (p.endMs || nowMs()) - p.startMs), 0);
      const span = times + (away >= 60000 ? ' · paused ' + minutes(away) : '');
      const billed = quote ? 'bills as ' + quote.billableMinutes + ' min' : running ? '' : (detail ? 'played ' + minutes(g.endMs - g.startMs) + ' · ' : '') + 'billed ' + g.billableMinutes + ' min';
      // A controller is named by its number; a PC or table line is named by its time, with the player if it is someone else's.
      const main = g.controller
        ? h('div', 'line-main', h('b', null, controllerNode(g)), h('span', { class: 'small muted', text: [span, billed].filter(Boolean).join(' · ') }))
        : h('div', 'line-main', h('b', { text: span }), h('span', { class: 'small muted', text: [billed, g.player && g.player !== customer ? g.player : ''].filter(Boolean).join(' · ') }));
      card.append(h('div', { class: 'line', data: { segment: g.id } }, g.controller ? h('span', { class: 'seat', 'aria-hidden': 'true', text: String(g.controller) }) : null, main,
        quote ? h('span', { class: 'line-amount', text: money(quote.totalPaise) }) : running ? timer(g, true) : h('span', { class: 'line-amount', text: money(g.totalPaise) }),
        editable ? sessionMenu(g) : null));
    }
    body.append(h('div', 'group-title', icon(unit ? unit.category : 'floor'), unit ? unit.name : unitId), card);
  }
  // The turf fee or a player's share of it: its own heading, and it follows the booking, so it has no edit menu here.
  const turf = orders.filter(o => o.category === 'Turf'), brought = orders.filter(o => o.category === 'Carried'), goods = orders.filter(o => o.category !== 'Turf' && o.category !== 'Carried');
  if (brought.length) body.append(h('div', 'group-title', icon('history'), 'Carried from earlier'), h('div', 'lines', brought.map(o => h('div', { class: 'line', data: { order: o.id } },
    h('div', 'line-main', h('b', { text: o.label }), h('span', { class: 'small muted', text: o.reason.replace('Carried from ', 'from ') })),
    h('span', { class: 'line-amount', text: money(o.totalPaise) })))));
  if (turf.length) {
    const card = h('div', 'lines');
    for (const o of turf) card.append(h('div', { class: 'line', data: { order: o.id } },
      h('div', 'line-main', h('b', { text: o.label }), h('span', { class: 'small muted', text: o.quantity > 1 ? money(o.unitPricePaise) + ' an hour' : o.purchaser && o.purchaser !== customer ? o.purchaser : o.reason || 'Turf' })),
      h('span', { class: 'line-amount', text: money(o.totalPaise) })));
    body.append(h('div', 'group-title', icon('turf'), 'Turf'), card);
  }
  if (goods.length) {
    const card = h('div', 'lines');
    for (const o of goods) {
      const product = !!o.productId;
      card.append(h('div', { class: 'line', data: { order: o.id } },
        h('div', 'line-main', h('b', { text: o.label + (o.quantity > 1 ? ' × ' + o.quantity : '') }), h('span', { class: 'small muted', text: (product ? money(o.unitPricePaise) + ' each' : o.reason || 'Charge') + (o.purchaser && o.purchaser !== customer ? ' · for ' + o.purchaser : '') })),
        h('span', { class: 'line-amount', text: money(o.totalPaise) }),
        editable ? menu([
          ...(product ? [['Change quantity', () => quantitySheet(o, tab), false, 'pencil']] : []),
          ['Remove', () => runCommand({ type: 'UPDATE_ORDER', id: o.id, revision: o.revision, quantity: 0, reason: 'Removed before billing' }, () => settleSheet(tab.id)), true, 'trash']
        ], 'Change ' + o.label) : null));
    }
    body.append(h('div', 'group-title', icon('sales'), 'Snacks & beverages'), card);
  }
  return segments.length + turf.length + brought.length + goods.length;
}

function settleSheet(tabId, mode = 'pay') {
  const tab = tabOf(tabId);
  if (!tab || tab.status !== 'open') { closeSheet(); return; }
  const draft = { discountOn: false, discount: '', received: '', edited: false, method: 'cash', account: newAccountStore(), toAccount: mode === 'credit', unpaid: new Map() };
  let picker = null, unpaidChooser = null;
  const comment = commentField();
  const subtotal = () => tabTotal(tab.id);
  const discountPaise = () => (draft.discountOn ? toPaise(draft.discount || 0) : 0);
  const totalPaise = () => subtotal() - discountPaise();
  // Money already paid towards this bill (up front, or left by another player) comes off what is collected now.
  // If more was paid up front than the bill comes to, the difference is handed back when the bill is closed.
  const heldPaise = () => heldFor([tab.id]);
  const advancePaise = () => Math.min(totalPaise(), heldPaise());
  const handBackPaise = () => Math.max(0, heldPaise() - totalPaise());
  const duePaise = () => totalPaise() - advancePaise();
  // A bill split off a group that is still open: anything paid over it can go towards that group's bill.
  const group = (() => { const origin = originOf(tab.id), home = tabOf(origin); return origin !== tab.id && home && home.status === 'open' ? home : null; })();
  const receivedPaise = () => (draft.edited ? toPaise(draft.received || 0) : mode === 'pay' ? duePaise() : 0);
  const unpaidPaise = () => (mode === 'credit' && unpaidChooser ? unpaidChooser.total() : 0);

  openSheet({
    title: tab.customer,
    sub: [tab.phone, tab.kind === 'quick_sale' ? 'Quick Sale' : ''].filter(Boolean).join(' · '),
    icon: 'wallet',
    focus: false,
    // Closing one player's bill returns to the list of players still to settle, when there is one.
    onClose: () => returnToSplit(tab.id),
    build(ui) {
      const lines = drawLines(ui.body, { segments: segmentsOf(tab.id), orders: ordersOf(tab.id), customer: tab.customer, tab, editable: true }), playing = stillPlaying(tab.id);
      const notes = notesBlock([tab.id]);
      if (notes) ui.body.append(notes);
      const adds = h('div', 'station-links', btn([icon('sales'), 'Add Items'], () => addItemsSheet(tab), 'quiet', { data: { action: 'items' } }));
      if (tab.kind === 'quick_sale') adds.append(btn([icon('plus'), 'Gaming or other charge'], () => manualChargeSheet(tab), 'quiet'));
      if (group && goodsOf(ordersOf(group.id)).length) adds.append(btn([icon('sales'), 'Items from ' + group.customer + '’s bill'], () => takeItemsSheet(tab, group), 'quiet', { data: { action: 'take-items' } }));
      // One row of quiet extras under the lines: add items, add a charge, add a discount.
      const discountSlot = h('span');
      adds.append(discountSlot);
      ui.body.append(h('div', { style: 'margin-top:8px' }, adds));
      if (playing) { ui.body.append(h('p', { class: 'muted', style: 'margin-top:16px', text: 'Still playing. End the remaining players to settle this bill.' })); tick(); return; }
      if (!lines) { ui.body.append(h('p', { class: 'muted', style: 'margin-top:16px', text: 'Nothing to settle yet.' })); return; }

      // Discount: one flat rupee amount, shown only when wanted.
      const discountInput = h('input', { type: 'number', min: '0', step: '1', inputmode: 'decimal', value: draft.discount, 'aria-label': 'Discount amount', data: { field: 'discount' }, oninput: () => { draft.discount = discountInput.value; paint(); } });
      const discountField = h('div', { hidden: !draft.discountOn }, field('Discount amount (₹)', discountInput));
      const discountText = h('span', { text: draft.discountOn ? 'Remove Discount' : 'Add Discount' });
      const discountToggle = btn([icon('percent'), discountText], () => { draft.discountOn = !draft.discountOn; discountField.hidden = !draft.discountOn; discountText.textContent = draft.discountOn ? 'Remove Discount' : 'Add Discount'; paint(); if (draft.discountOn) discountInput.focus(); }, 'quiet', { data: { action: 'discount' } });
      discountSlot.append(discountToggle);
      ui.body.append(discountField);
      let accountTitle = null;
      if (mode === 'credit') {
        picker = accountPicker(draft.account);
        accountTitle = h('div', 'group-title', icon('credits'), 'Move the outstanding amount to');
        ui.body.append(accountTitle, picker.node);
        // Optional: which items are still unpaid, so the credit statement says what the amount was for.
        const goods = goodsOf(ordersOf(tab.id));
        unpaidChooser = goods.length ? itemChooser(goods, draft.unpaid, () => paint()) : null;
        if (unpaidChooser) ui.body.append(h('div', 'group-title', icon('sales'), 'Items still unpaid (optional)'), unpaidChooser.node);
        ui.body.append(comment.node);
      }

      // The footer is the financial summary: the bill, what was already paid towards it, and what is still outstanding.
      const sums = h('div', 'sums'), totalValue = h('div', { class: 'foot-total', data: { total: '1' } }), balance = h('div', 'sums');
      const sum = (label, value, tone = '') => h('div', ('sum ' + tone).trim(), h('span', { text: label }), h('b', { text: value }));
      // Who left money towards this bill earlier: "Controller 1" for one of this group, the customer's name otherwise.
      // Money paid up front by this customer is simply "Paid in advance".
      const held = (state.Advances || []).filter(a => a.tabId === tab.id && a.status === 'held'), leftByOthers = held.filter(a => /-advance$/.test(a.id));
      const paidEarlier = leftByOthers.map(a => { const name = (tabOf(a.sourceTabId) || {}).customer || ''; return name.startsWith(tab.customer + ' · ') ? name.slice(tab.customer.length + 3) : name; }).filter(Boolean);
      const paidLabel = !leftByOthers.length ? 'Paid in advance' : 'Paid towards this bill' + (paidEarlier.length ? ' by ' + [...new Set(paidEarlier)].join(', ') : '');
      const received = h('input', { type: 'number', min: '0', step: '1', inputmode: 'decimal', 'aria-label': 'Amount received', data: { field: 'received' }, oninput: () => { draft.edited = true; draft.received = received.value; paint(); } });
      const method = methodChoice(draft.method, v => { draft.method = v; });
      const receivedRow = h('div', 'foot-row', field(mode === 'pay' ? 'Received (₹)' : 'Received now (₹)', received), method.node);
      ui.foot.append(
        sums,
        h('div', 'foot-row', h('div', { class: 'foot-label', text: 'Outstanding' }), totalValue),
        receivedRow,
        balance);
      const primary = ui.primary('');
      if (mode === 'pay') {
        // The other ways to close this bill, one tap each.
        const actions = h('div', 'actions'), endings = state.Endings.filter(e => e.reviewTabId === tab.id && e.status === 'review');
        const action = (key, name, label, hint, run) => actions.append(h('button', { type: 'button', class: 'action', title: hint, 'aria-label': hint, data: { action: key }, onclick: run }, icon(name), h('span', { text: label })));
        if (heldPaise() < totalPaise()) action('credit', 'credits', 'Move to Credit', 'Put the outstanding amount on a credit account', () => { mode = 'credit'; draft.edited = false; draft.toAccount = true; ui.redraw(); });
        if (segmentsOf(tab.id).some(g => g.status === 'ended') || tab.kind === 'turf' || tab.kind === 'turf_player') action('move', 'transfer', 'Move System', 'They carry on playing on another system', () => moveSheet(tab));
        if (state.Tabs.some(t => t.status === 'open' && t.id !== tab.id && (segmentsOf(t.id).length || ordersOf(t.id).length))) action('add-to-bill', 'users', 'Add to Bill', 'Someone else will pay: add this to their bill', () => addToBillSheet(tab));
        if (endings.length > 1 && !held.length) action('split', 'split', 'Split Bill', 'Each player pays their own', () => runCommand({ type: 'SPLIT_REVIEW', tabId: tab.id }, result => chooseTabSheet(result.tabIds, result.groupName)));
        ui.foot.append(actions);
      } else ui.foot.append(h('div', 'foot-links', btn([icon('back'), 'Back to payment'], () => { mode = 'pay'; draft.edited = false; ui.redraw(); }, 'quiet')));

      function paint() {
        const sub = subtotal(), discount = discountPaise(), valid = Number.isSafeInteger(discount) && discount >= 0 && discount <= sub, total = valid ? sub - discount : sub;
        const advance = valid ? advancePaise() : 0, due = total - advance, back = valid ? handBackPaise() : 0;
        // The large figure is what is still outstanding. Rows above it appear only when something changed that figure:
        // a discount (subtotal, discount) or money already paid towards this bill (total bill, paid, and by whom).
        sums.replaceChildren(
          ...(discount > 0 && valid ? [sum('Subtotal', money(sub)), sum('Discount', '−' + money(discount))] : []),
          ...(advance > 0 ? [sum('Total bill', money(total)), sum(paidLabel, '−' + money(advance + back), 'good')] : []));
        // Nothing to take when the bill is already paid for; the form for money received steps aside.
        receivedRow.hidden = back > 0;
        totalValue.textContent = valid ? money(due) : 'Check discount';
        totalValue.classList.toggle('clear', valid && due === 0);
        if (!draft.edited) received.value = mode === 'pay' ? String(due / 100) : '0';
        const paid = receivedPaise(), left = due - paid;
        // Paying over the bill is allowed only when there is a group bill for the extra to come off, and it is always spelled out:
        // what goes to this bill, what goes to the other bill, and the money taken in all.
        const over = mode === 'pay' && paid > due && !!group;
        const sound = valid && Number.isSafeInteger(paid) && paid >= 0 && (paid <= due || over);
        balance.replaceChildren(...(back > 0 ? [sum('Hand back to the customer', money(back), 'warn-text strong')] : !sound ? [sum(valid ? 'Received is more than this bill.' : 'Discount cannot be more than ' + money(sub) + '.', '', 'warn-text')]
          : over ? [sum('Towards this bill', money(due)), sum('Extra towards ' + group.customer + '’s bill', money(paid - due), 'extra'), sum('Total received now', money(paid), 'strong')]
            : mode === 'credit' ? (left <= 0 ? [sum('Nothing is left to move to credit', '', 'extra')] : unpaidPaise() > left ? [sum('The unpaid items come to more than ' + money(left) + '.', '', 'warn-text')] : paid > 0 ? [sum('Goes to the credit account', money(left), 'extra')] : [])
              : left > 0 ? [sum('Outstanding after this payment', money(left), 'warn-text')] : []));
        const label = back > 0 ? 'Hand Back ' + money(back) + ' · Close Bill' : mode === 'credit' ? 'Move ' + money(Math.max(0, left)) + ' to Credit' : paid > 0 ? 'Collect Payment · ' + money(paid) : due > 0 ? 'Save Unpaid' : 'Close Bill';
        primary.dataset.label = label; primary.textContent = label; primary.disabled = !sound || (mode === 'credit' && (left <= 0 || unpaidPaise() > left));
      }
      paint();
      // Straight to where the account is chosen: no scrolling to look for it.
      if (accountTitle && draft.toAccount) { draft.toAccount = false; accountTitle.scrollIntoView({ block: 'start' }); picker.focus(); }
    },
    command() {
      const sub = subtotal(), discount = discountPaise(), paid = receivedPaise();
      if (!Number.isSafeInteger(discount) || discount < 0 || discount > sub) throw new Error('Discount must be between zero and the subtotal.');
      const due = duePaise(), over = mode === 'pay' && paid > due && !!group;
      if (!Number.isSafeInteger(paid) || paid < 0 || (paid > due && !over)) throw new Error('Received is more than this bill.');
      const back = handBackPaise();
      return { type: 'SETTLE_REVIEW', tabId: tab.id, settlement: mode, discountType: discount > 0 ? 'fixed' : 'none', discountValue: discount, amountPaise: back > 0 ? 0 : paid, method: draft.method, surplusTabId: over ? group.id : undefined, refundPaise: back > 0 ? back : undefined, ...(mode === 'credit' ? { ...picker.value(), note: comment.value(), unpaidItems: unpaidChooser ? unpaidChooser.items() : undefined } : {}) };
    },
    // Paid in full: nothing more to look at. The sheet closes to where the receptionist was (the floor, the list of players
    // still to settle, or the turf booking), with a short note and the receipt one tap away. Anything still owing shows the bill.
    then: result => {
      const bill = state.Bills.find(x => x.id === result.billId);
      if (!bill || bill.totalPaise > bill.paidPaise || (state.CreditTransfers || []).some(t => t.billId === bill.id)) return receiptSheet(result.billId);
      closeSheet();
      returnToSplit(tab.id);
      const how = result.method === 'upi' ? 'UPI' : result.method === 'cash' ? 'Cash' : '';
      // Money taken over this bill for a group's bill (result.advanceTabId names it); money paid in advance is not that.
      const extra = result.advanceTabId ? ' ' + money(result.advancePaise) + ' of it towards ' + ((tabOf(result.advanceTabId) || {}).customer || 'the group') + '’s bill.' : '';
      const back = result.refundPaise ? ' Hand back ' + money(result.refundPaise) + '.' : '';
      const text = (result.amountPaise ? 'Paid ' + [money(result.amountPaise), how, result.receiptNumber].filter(Boolean).join(' · ') + '.' : 'Bill ' + (result.billNumber || '') + ' closed.') + extra + back;
      return { text, action: { label: 'Print receipt', run: async () => { try { printReceipt(await rpc('rpcBill', token, result.billId)); } catch (e) { notify('error', e.message); } } } };
    }
  });
}

// After "Settle players separately": one list of who has paid and who has not.
// It comes back after each bill, so the next player can be settled without going to Open tabs.
let splitQueue = null;
// A turf bill (the booking's own or a player's) goes back to its booking.
function returnToSplit(tabId) {
  const booking = turfBookingForTab(tabId);
  if (splitQueue && splitQueue.tabIds.includes(tabId)) chooseTabSheet(splitQueue.tabIds, splitQueue.groupName);
  // A turf booking again, unless this bill settled it: then there is nothing more to do there.
  else if (booking && turfStatusOf(booking.id).state !== 'settled') turfDetailSheet(booking.id);
}
// Bills that belong together: a group's own bill, the separate bills split from it, and any bill added to them.
function originOf(tabId) {
  const link = state.Endings.find(e => e.reviewTabId === tabId && e.status === 'review');
  return link ? link.originalTabId : tabId;
}
function groupTabIds(tabId) {
  const origin = originOf(tabId);
  return state.Tabs.filter(t => originOf(t.id) === origin).map(t => t.id);
}
// Tick one player to settle them alone, or several to put them on one bill and settle together.
function chooseTabSheet(tabIds, groupName) {
  splitQueue = { tabIds, groupName };
  const picked = new Set();
  const listed = () => splitQueue.tabIds.map(tabOf).filter(Boolean);
  const billOf = t => { const d = state.BillDetails.find(d => d.tabId === t.id && !state.Corrections.some(c => c.kind === 'bill_void' && c.targetId === d.id)); return d && state.Bills.find(b => b.id === d.id); };
  const payable = t => t.status === 'open' && !stillPlaying(t.id);
  const units = [...new Set(listed().flatMap(t => segmentsOf(t.id).map(g => (unitOf(g.unitId) || {}).name || g.unitId)))];
  // Under a row: any PC or table time on that bill (and whose it was), and how many items.
  const note = t => { const items = ordersOf(t.id).length; return [
    ...segmentsOf(t.id).filter(g => !g.controller).map(g => ((unitOf(g.unitId) || {}).name || g.unitId) + (g.player && g.player !== t.customer ? ' · ' + g.player : '')),
    items ? items + (items === 1 ? ' item' : ' items') : ''
  ].filter(Boolean).join(', '); };
  openSheet({
    title: listed().some(payable) ? 'Who is paying?' : 'All settled',
    icon: listed().some(payable) ? 'users' : 'checkCircle',
    tone: listed().some(payable) ? '' : 'jade',
    sub: [groupName, units.join(', ')].filter(Boolean).join(' · '),
    focus: false,
    onClose() { splitQueue = null; },
    build(ui) {
      const card = h('div', 'lines'), tabs = listed(), open = tabs.filter(payable);
      for (const id of [...picked]) if (!open.some(t => t.id === id)) picked.delete(id);
      for (const t of tabs) {
        const own = segmentsOf(t.id).filter(g => g.controller), bill = billOf(t), can = payable(t);
        const status = bill ? (bill.totalPaise <= bill.paidPaise ? 'Paid' : state.CreditTransfers.some(x => x.billId === bill.id) ? 'On credit' : 'Part paid') : '';
        const toggle = () => { if (picked.has(t.id)) picked.delete(t.id); else picked.add(t.id); ui.redraw(); };
        card.append(h('div', { class: 'line' + (can ? ' pick' : ''), role: can ? 'button' : null, tabindex: can ? '0' : null, 'aria-pressed': can ? String(picked.has(t.id)) : null, data: { player: t.id },
          onclick: can ? toggle : null, onkeydown: can ? e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } } : null },
        can ? h('input', { type: 'checkbox', checked: picked.has(t.id), tabindex: '-1', 'aria-hidden': 'true', data: { select: t.id } }) : null,
        h('div', 'line-main', h('b', null, own.length === 1 ? controllerNode(own[0]) : t.customer), note(t) ? h('span', { class: 'small muted', text: note(t) }) : null),
        h('span', { class: 'line-amount', text: money(bill ? bill.totalPaise : tabTotal(t.id)) }),
        bill ? btn(status, e => { e.stopPropagation(); receiptSheet(bill.id); }, 'quiet', { data: { paid: t.id } }) : !can ? h('span', { class: 'badge good', text: 'Playing' }) : null));
      }
      ui.body.append(card);
      if (!open.length) { ui.foot.append(btn([icon('check'), 'Done'], dismissSheet, 'primary block', { data: { action: 'done' } })); return; }
      const n = picked.size, sum = [...picked].reduce((total, id) => total + tabTotal(id), 0);
      ui.primary(n === 0 ? 'Tick who is paying' : n === 1 ? 'Settle · ' + money(sum) : 'Settle ' + n + ' together · ' + money(sum), n === 0);
      if (open.length > 1) ui.foot.append(h('div', 'foot-links', btn(n === open.length ? 'Clear' : 'Select all', () => { if (n === open.length) picked.clear(); else for (const t of open) picked.add(t.id); ui.redraw(); }, 'quiet', { data: { action: 'select-all' } })));
    },
    command() {
      const ids = splitQueue.tabIds.filter(id => picked.has(id));
      if (!ids.length) throw new Error('Tick who is paying.');
      if (ids.length === 1) { settleSheet(ids[0]); return null; }
      return { type: 'COMBINE_TABS', tabIds: ids };
    },
    then: result => settleSheet(result.tabId)
  });
}

// "Put it on my friends' bill": the whole visit moves onto another open bill, once. Nobody starts playing anywhere.
function addToBillSheet(tab) {
  // One entry per group, not per player: "PS5 1" rather than each of its controllers.
  const mine = originOf(tab.id), groups = new Map();
  for (const t of state.Tabs) {
    if (t.status !== 'open' || t.id === tab.id || !(segmentsOf(t.id).length || ordersOf(t.id).length)) continue;
    const origin = originOf(t.id);
    // Their own group's bill is offered first (the others will pay); its other separate bills are combined under "Who is paying?".
    if (origin === mine && t.id !== origin) continue;
    if (!groups.has(origin)) groups.set(origin, []);
    groups.get(origin).push(t);
  }
  const entries = [...groups].map(([origin, members]) => {
    const home = members.find(t => t.id === origin) || null, played = members.flatMap(t => segmentsOf(t.id)), now = played.filter(g => g.status === 'active');
    return {
      origin, members, home,
      name: home ? home.customer : members[0].customer.split(' · ')[0],
      // Where they are playing now; if they have stopped, where they played.
      units: [...new Set((now.length ? now : played).map(g => (unitOf(g.unitId) || {}).name || g.unitId))],
      playing: members.some(t => stillPlaying(t.id)),
      total: members.reduce((sum, t) => sum + tabTotal(t.id), 0),
      own: origin === mine
    };
  }).sort((a, b) => Number(b.own) - Number(a.own));
  let chosen = '';
  const comment = commentField();
  openSheet({
    title: 'Add to another bill',
    icon: 'users',
    sub: tab.customer + ' · ' + money(tabTotal(tab.id)),
    focus: false,
    onClose: () => settleSheet(tab.id),
    build(ui) {
      if (!entries.length) { ui.body.append(h('p', { class: 'muted', text: 'No other bill is open.' })); return; }
      const card = h('div', 'lines');
      for (const entry of entries) {
        const place = entry.units.join(', ');
        card.append(h('div', { class: 'line pick', role: 'button', tabindex: '0', 'aria-pressed': String(chosen === entry.origin), data: { bill: entry.origin }, onclick: () => { chosen = entry.origin; ui.redraw(); } },
          h('input', { type: 'checkbox', checked: chosen === entry.origin, tabindex: '-1', 'aria-hidden': 'true' }),
          h('div', 'line-main', h('b', { text: place || entry.name }), h('span', { class: 'small muted', text: [place ? entry.name : (entry.members[0].kind === 'quick_sale' ? 'Quick Sale' : ''), entry.own ? 'their own group' : '', entry.playing ? 'playing' : '', !entry.home && entry.members.length > 1 ? entry.members.length + ' separate bills' : ''].filter(Boolean).join(' · ') })),
          h('span', { class: 'line-amount', text: money(entry.total) })));
      }
      ui.body.append(card, comment.node);
      const target = entries.find(entry => entry.origin === chosen);
      ui.primary(target ? 'Add ' + money(tabTotal(tab.id)) + ' to ' + (target.units.join(', ') || target.name) : 'Choose a bill', !target);
    },
    command() {
      const target = entries.find(entry => entry.origin === chosen);
      if (!target) throw new Error('Choose a bill.');
      // A group still on one bill takes the charges onto that bill. A group already being settled player by player
      // gets this bill as one more row in its list, to be paid alone or together with any of them.
      const note = comment.value();
      if (target.own) return { type: 'KEEP_SHARED', tabId: tab.id, note };
      return target.home ? { type: 'CONSOLIDATE_TABS', sourceTabId: tab.id, tabId: target.home.id, note } : { type: 'ATTACH_TO_GROUP', sourceTabId: tab.id, memberTabId: target.members[0].id, note };
    },
    then(result, command) {
      if (command.type !== 'ATTACH_TO_GROUP') { closeSheet(); return; }
      const target = entries.find(entry => entry.origin === chosen);
      chooseTabSheet(groupTabIds(tab.id), target ? target.name : '');
    }
  });
}

// "What does it come to so far?" Tap a station in use: every running timer priced as if it stopped now, plus items.
async function costSheet(unit) {
  const players = activeOn(unit.id);
  if (!players.length) return;
  let quote;
  try { quote = viewHere(view => ArenaViews.runningCost(view, unit.id, nowMs())) || await rpc('rpcQuote', token, unit.id); }
  catch (e) { notify('error', e.message); return; }
  const tabs = [...new Set(players.map(g => g.tabId))].map(tabOf).filter(Boolean);
  openSheet({
    title: unit.name + ' · so far',
    icon: unit.category,
    tone: 'jade',
    sub: groupNames(players) + ' · at ' + clock(quote.atMs),
    focus: false,
    build(ui) {
      for (const t of tabs) {
        if (tabs.length > 1) ui.body.append(h('p', { class: 'muted', style: 'margin:16px 0 -8px', text: t.customer + ' · ' + money(quote.tabTotals[t.id] || 0) }));
        drawLines(ui.body, { segments: segmentsOf(t.id), orders: ordersOf(t.id), customer: t.customer, editable: false, quotes: quote.quotes });
      }
      const chosen = players.filter(g => !unpicked.has(g.id));
      ui.foot.append(
        h('div', 'foot-row', h('div', { class: 'foot-label', text: 'So far' }), h('div', { class: 'foot-total', text: money(quote.totalPaise), data: { soFar: '1' } })),
        h('div', 'foot-row',
          btn([icon('sales'), 'Add Items'], () => addItemsFor(unit), 'block', { data: { action: 'items' } }),
          btn(unit.category === 'PS5' ? endLabel(chosen.length) : 'End Session', () => endSheet(unit.category === 'PS5' ? chosen : [players[0]]), 'primary block', { disabled: !chosen.length, data: { action: 'end' } })));
    }
  });
}

// What a bill on a credit account was for, shown under its row.
function billBreakdown(holder, data, back) {
  const bill = data.bill, detail = data.detail, paidThen = data.payments.reduce((sum, p) => sum + p.amountPaise, 0);
  const kv = (label, value) => h('div', 'kv', h('span', { text: label }), h('b', { text: value }));
  if (detail) holder.append(h('p', { class: 'small muted', text: detail.customer + ' · ' + day(detail.createdMs) + ', ' + clock(detail.createdMs) }));
  drawLines(holder, { segments: data.segments, orders: data.orders, customer: detail ? detail.customer : '', editable: false, detail: true, pauses: data.pauses });
  // A figure is shown only when it differs from the one above it: a bill moved whole to credit is one line.
  // Repayments are lines of their own on the account; they are not taken off this bill here.
  const moved = data.transfer && data.transfer.amountPaise !== bill.totalPaise ? data.transfer.amountPaise : null;
  holder.append(h('div', { style: 'margin-top:8px' },
    detail && detail.discountPaise ? [kv('Subtotal', money(detail.subtotalPaise)), kv('Discount', '−' + money(detail.discountPaise))] : null,
    kv('Bill total', money(bill.totalPaise)),
    paidThen ? kv('Paid at the counter', money(paidThen)) : null,
    moved !== null ? kv('Moved to credit', money(moved)) : null),
  h('div', 'station-links', btn([icon('bills'), 'Open bill ' + data.number], () => receiptSheet(bill.id, back), 'quiet', { data: { action: 'open-bill' } })));
}

// ---------- Moving ----------
// Pick one system and the whole bill goes there on one timer. Pick two or more and a timer starts on each, all on this bill.
function moveSheet(tab) {
  const freeSlots = unit => 4 - activeOn(unit.id).length;
  // A free system, or a PS5 in use that still has a free controller (to join friends there).
  const offered = unit => !inUse(unit) || (unit.category === 'PS5' && !legacyOn(unit.id) && freeSlots(unit) > 0);
  const chosen = new Set();
  // How many stopped on this bill; the usual number to start again, but fewer may play on.
  const movers = Math.max(1, state.Endings.filter(e => e.reviewTabId === tab.id && e.status === 'review' && e.segmentId).length);
  let joinTab = '', time, controllers = 0, acked = false, turfTo = '';
  const comment = commentField();
  // Today's turf bookings still to be paid: a group that played here and goes on to the turf pays there, once.
  const fromFloor = tab.kind !== 'turf' && tab.kind !== 'turf_player';
  const turfToday = fromFloor ? (state.TurfBookings || []).filter(b => b.status === 'booked' && b.dateKey === dayKey(nowMs()) && turfStatusOf(b.id).state !== 'settled' && !(b.tabId && tabOf(b.tabId) && tabOf(b.tabId).status !== 'open')).sort((a, b) => Number(a.startHour) - Number(b.startHour)) : [];
  const onePs5 = () => { const only = chosen.size === 1 ? unitOf([...chosen][0]) : null; return only && only.category === 'PS5' ? only : null; };
  const seatCount = () => { const unit = onePs5(); return unit ? Math.min(controllers || movers, freeSlots(unit)) : 0; };
  openSheet({
    title: 'Move to another system',
    sub: tab.customer,
    icon: 'transfer',
    focus: false,
    onClose: () => settleSheet(tab.id),
    build(ui) {
      for (const category of CATEGORIES) {
        const units = state.Equipment.filter(u => u.category === category && offered(u));

// ---------- Corrections: always with a reason ----------
function reasonSheet({ title, sub, action, icon: glyphName, tone, extra, command, then }) {

    title, sub, icon: glyphName || 'pencil', tone,
    build(ui) {

      reason = reason || textInput({ 'aria-label': 'Reason', data: { field: 'reason' } });
      ui.body.append(field('Reason', reason));
      ui.primary(action);
    },
    command() { if (reason.value.trim().length < 3) throw new Error('Enter a reason.'); return command(reason.value.trim()); },
    then
  });
}
function voidSessionSheet(segment) {

  reasonSheet({
    title: 'Void session', sub: (unit ? unit.name : '') + ' · ' + segment.player + ' · nothing will be charged', action: 'Void session', icon: 'ban', tone: 'bad',
    command: reason => ({ type: 'VOID_SEGMENT', segmentId: segment.id, reason }),
    then(result) { if (result.closed || stillPlaying(result.tabId) || !tabOf(result.tabId)) closeSheet(); else settleSheet(result.tabId); }
  });

function correctTimeSheet(segment) {
  const unit = unitOf(segment.unitId), ended = segment.status === 'ended';
  const startText = istInput(segment.startMs), endText = ended ? istInput(segment.endMs) : '';
  let start, end;
  reasonSheet({
    title: 'Correct time', sub: (unit ? unit.name : '') + ' · ' + segment.player, action: 'Save correction', icon: 'clock',
    extra(ui) {
      start = start || h('input', { type: 'datetime-local', value: startText, 'aria-label': 'Start time', data: { field: 'start' } });

    },

      return command;

// ---------- Receipt ----------
const STATUS_LABEL = { paid: ['Paid', 'good'], part: ['Part paid', 'warn'], unpaid: ['Unpaid', 'warn'], credit: ['On credit', 'gold'], carried: ['Moved to next booking', 'gold'], void: ['Voided', 'bad'] };
// The icon and colour that stand for a bill's state at the top of its sheet.
const BILL_STATE = { paid: ['checkCircle', 'jade'], part: ['clock', 'warn'], unpaid: ['clock', 'warn'], credit: ['credits', 'gold'], carried: ['reservations', 'gold'], void: ['ban', 'bad'] };
function statusBadge(status) { const [text, tone] = STATUS_LABEL[status] || [status, '']; return h('span', { class: 'badge ' + tone, text }); }
function whatsappLink(phone, text) {
  let digits = String(phone || '').replace(/\D/g, '');
  if (digits.length === 10) digits = '91' + digits;
  // WhatsApp's own address, not the wa.me short link: wa.me's redirect turns every emoji into a "�" (checked 14 October).
  return 'https://api.whatsapp.com/send?phone=' + digits + '&text=' + encodeURIComponent(text);
}
function whatsapp(phone, text) {
  window.open(whatsappLink(phone, text), '_blank', 'noopener');
}
// A message that goes only once a save is confirmed. A browser opens a window only on the tap itself, so the window
// is opened then, empty, and given the message after the save; if the save fails it is closed and nothing is sent.
function whatsappAfterSave() {
  let win = null;
  try { win = window.open('', '_blank'); } catch (e) { win = null; }
  return {
    send(phone, text) {
      if (win && !win.closed) { win.opener = null; win.location.href = whatsappLink(phone, text); }
      else whatsapp(phone, text);
    },
    drop() { if (win && !win.closed) win.close(); }
  };
}

function printReceipt(data) {
  const el = (cls, text) => h('div', { class: cls, text });
  const row = (a, b, cls = '') => h('div', ('p-row ' + cls).trim(), h('span', { text: a }), h('span', { text: b }));
  const area = $('printArea'), bill = data.bill, detail = data.detail, due = Math.max(0, bill.totalPaise - bill.paidPaise), extras = data.extras || [];
  area.replaceChildren(
    el('wordmark', 'City Arena'), el('p-center p-small', 'The theatre of dreams'), el('p-rule'),
    row('Bill ' + data.number, detail ? day(detail.createdMs) + ', ' + clock(detail.createdMs) : ''),
    row(detail ? detail.customer : '', data.tab && data.tab.phone ? data.tab.phone : ''),
    el('p-rule'));
  // Gaming, one heading per system.
  const byUnit = new Map();
  for (const g of data.segments) { if (!byUnit.has(g.unitId)) byUnit.set(g.unitId, []); byUnit.get(g.unitId).push(g); }
  for (const [unitId, list] of byUnit) {
    const unit = unitOf(unitId);
    area.append(el('p-head', unit ? unit.name : unitId));
    for (const g of list) area.append(row(g.controller ? controllerLabel(g) : 'Gaming', money(g.totalPaise)), el('p-sub', period(g.startMs, g.endMs) + ' · billed ' + g.billableMinutes + ' min'));
  }
  const turf = data.orders.filter(o => o.category === 'Turf'), brought = data.orders.filter(o => o.category === 'Carried'), goods = data.orders.filter(o => o.category !== 'Turf' && o.category !== 'Carried');
  if (brought.length) area.append(el('p-head', 'Carried from earlier'));
  for (const o of brought) area.append(row(o.label, money(o.totalPaise)), el('p-sub', o.reason));
  if (turf.length) area.append(el('p-head', 'Turf'));
  for (const o of turf) area.append(row(o.label, money(o.totalPaise)), ...(o.quantity > 1 ? [el('p-sub', o.quantity + ' × ' + money(o.unitPricePaise))] : []));
  if (goods.length) area.append(el('p-head', 'Snacks & beverages'));
  for (const o of goods) area.append(row(o.label, money(o.totalPaise)), el('p-sub', o.quantity + ' × ' + money(o.unitPricePaise)));
  area.append(el('p-rule'));
  if (detail && detail.discountPaise) area.append(row('Subtotal', money(detail.subtotalPaise)), row('Discount', '−' + money(detail.discountPaise)));
  area.append(row('Total bill', money(bill.totalPaise), 'p-strong'), el('p-dash'));
  for (const p of data.payments) area.append(row((p.method === 'upi' ? 'UPI' : 'Cash') + ' · ' + p.number + (p.advance ? ' · in advance' : '') + (p.paidBy ? ' · by ' + p.paidBy : ''), money(p.amountPaise)));
  for (const r of data.returned || []) area.append(row('Handed back · ' + r.number, money(-r.amountPaise)));
  if (data.payments.length) area.append(row(data.transfer ? 'Paid at the counter' : 'Paid towards this bill', money(data.transfer ? data.payments.reduce((sum, p) => sum + p.amountPaise, 0) : bill.paidPaise)));
  area.append(row(data.transfer ? 'On credit · ' + data.transfer.account : 'Outstanding', money(data.transfer ? data.transfer.amountPaise : due), 'p-strong'));
  // Money taken at the same time for someone else's bill is printed apart, so this bill never reads as overcharged.
  if (extras.length) {
    area.append(el('p-dash'), el('p-head', 'Also received'));
    for (const x of extras) area.append(row((x.method === 'upi' ? 'UPI' : 'Cash') + ' · ' + x.number + ' · towards ' + x.towards, money(x.amountPaise)));
    area.append(row('Total money received', money(data.payments.reduce((sum, p) => sum + p.amountPaise, 0) + extras.reduce((sum, x) => sum + x.amountPaise, 0))));
  }
  area.append(el('p-rule'), el('p-center', 'Thank you'));
  window.print();
}

          ...(correctable(data) && data.payments.length ? [['Correct payment', () => correctBillPaymentSheet(data, back), false, 'pencil'], ['Correct charges', () => correctChargesSheet(data, back), false, 'bills']] : []),
          ...(data.status !== 'void' && bill.paidPaise === 0 && !data.transfer ? [['Void bill', () => reasonSheet({ title: 'Void bill ' + data.number, sub: 'The visit opens again so it can be corrected.', action: 'Void bill', icon: 'ban', tone: 'bad', command: reason => ({ type: 'VOID_BILL', billId, reason }), then: result => (result.tabId && tabOf(result.tabId) ? settleSheet(result.tabId) : closeSheet()) }), true, 'ban']] : [])
        ], 'Bill actions'))));

function correctBillPaymentSheet(data, back) {
  const bill = data.bill, customer = data.detail ? data.detail.customer : '';
  const ahead = data.payments.filter(p => p.advance || p.paidBy).reduce((sum, p) => sum + p.amountPaise, 0);
  const atCounter = bill.paidPaise - ahead, owed = bill.totalPaise - ahead, store = newAccountStore();
  const amount = h('input', { type: 'number', min: '0', step: '1', inputmode: 'decimal', value: String(atCounter / 100), 'aria-label': 'Actually received', data: { field: 'correct-received' } });
  const method = methodChoice((data.payments.find(p => !p.advance && !p.paidBy) || {}).method || 'cash');
  const reason = textInput({ 'aria-label': 'Reason', data: { field: 'reason' } });

  openSheet({
    title: 'Correct payment · Bill ' + data.number,
    sub: customer,
    icon: 'pencil',
    tone: 'warn',
    onClose: () => receiptSheet(bill.id, back),
    build(ui) {
      const kv = (label, value) => h('div', 'kv', h('span', { text: label }), h('b', { text: value }));
      ui.body.append(h('div', 'summary', kv('Total bill', money(bill.totalPaise)), ahead ? kv('Paid in advance', money(ahead)) : null, kv('Recorded as received', money(atCounter))));
      ui.body.append(h('div', { class: 'foot-row', style: 'margin-top:18px' }, field('Actually received (₹)', amount), method.node));
      // The rest of the bill: left unpaid, or moved to a credit account (whole, or what is left after a part payment).
      const restBox = h('div', { style: 'margin-top:18px' });
      const choice = segmented([['unpaid', 'Leave unpaid'], ['credit', 'Move to Credit']], rest, v => { rest = v; drawRest(); if (v === 'credit') picker.focus(); });
      choice.node.dataset.field = 'rest';
      const restTitle = h('div', 'group-title', icon('credits'), h('span'));
      function drawRest() {
        const left = owed - toPaise(amount.value || 0);
        restBox.hidden = !(left > 0);
        restTitle.lastChild.textContent = 'The other ' + money(Math.max(0, left));
        restBox.replaceChildren(restTitle, h('div', 'field', choice.node));
        if (rest === 'credit') { picker = picker || accountPicker(store); restBox.append(picker.node); }

    command() {

      const toCredit = rest === 'credit' && owed - received > 0;

}

// ---------- WhatsApp messages to a credit account ----------
// The start of the business day that contains a moment (Settings can start it after midnight for late trading).
function businessDayFrom(ms) {
  const startMinutes = settingValue('businessDayStartMinutes', 0);
  return Date.parse(dayKey(ms - startMinutes * 60000) + 'T00:00:00+05:30') + startMinutes * 60000;
}
// The greeting at the moment the message is made (India time), never saved: morning from 5 AM, afternoon from noon,
// evening from 5 PM; in the small hours just "Hello".
function greetingLine(name, ms) {
  const hour = Number(new Date(ms + 19800000).toISOString().slice(11, 13));
  const word = hour >= 17 ? 'Good Evening' : hour >= 12 ? 'Good Afternoon' : hour >= 5 ? 'Good Morning' : '';
  return 'Hello ' + name + (word ? ', ' + word : '') + '! 👋';
}
// A credit account's message, in the owner's wording: the balance the day started with, today's charges, and then
// either what is outstanding (nothing paid today), what was paid and what remains, or that the account is settled.
// The same message is sent at the end of the day and after a payment.
function dayStatementText(account) {
  const now = nowMs(), from = businessDayFrom(now), due = creditSummary(account.id).outstandingPaise, today = ms => ms >= from;
  let added = 0, paid = 0;
  // What the customer already owed when the account was opened is their opening balance, even when entered today.
  for (const e of state.CreditEntries.filter(e => e.accountId === account.id && today(e.createdMs) && e.kind !== 'opening')) added += e.amountPaise;
  for (const t of state.CreditTransfers.filter(t => t.accountId === account.id && today(t.createdMs))) added += t.amountPaise;
  // A payment corrected today is left out together with its reversal; a reversal of an earlier day's payment raises the balance.
  const reversed = new Set(state.Corrections.filter(c => c.kind === 'payment_reversal').map(c => c.targetId));
  for (const r of state.CreditReceipts.filter(r => r.accountId === account.id)) {
    const p = state.Payments.find(p => p.id === r.id);
    if (!p || !today(p.createdMs)) continue;
    if (p.amountPaise < 0 || reversed.has(p.id)) added -= p.amountPaise;
    else paid += p.amountPaise;
  }
  const opening = due - added + paid;
  const lines = [greetingLine(account.name, now), '', 'Hope you’re doing well! 😊', '', 'Here’s a little update on your account at City Arena.', '', '🧾 Your Account Summary', '', '💰 Opening Balance: ' + money(opening), '📋 Today’s Charges: ' + money(added)];
  if (!paid && due > 0) {
    lines.push('💳 Total Outstanding: ' + money(due), '', 'Whenever possible, we’d be grateful if you could clear your balance at your earliest convenience. 💛', '', 'Thank you for being a part of City Arena. We truly appreciate your continued support!');
  } else {
    lines.push('🧾 Total Bill: ' + money(opening + added), '✅ Payment Received: ' + money(paid), '💳 Remaining Balance: ' + money(due), '');
    if (due > 0) lines.push('Thank you so much for your payment! We truly appreciate it. 💛', '', 'Whenever convenient, we’d be grateful if you could clear the remaining balance.', '', 'Thank you for your continued support. Looking forward to seeing you again soon! 🙌');
    else lines.push('You’re all settled! ✨', '', 'Thank you so much for clearing your balance. We truly appreciate your support and trust in City Arena! 💛', '', 'Thank you for your continued support. Looking forward to seeing you again soon! 🙌🙌');
  }
  lines.push('', '#PlayAtCityArena', 'Team City Arena', 'Mangalore');
  return lines.join('\n');
}

function accountSheet(accountId) {
  const account = state.CreditAccounts.find(a => a.id === accountId);
  if (!account) { closeSheet(); return; }
  const summary = creditSummary(account.id), due = summary.outstandingPaise, phone = creditPhone(account.id);
  let method = 'cash', amount, showEarlier = false;
  openSheet({
    title: account.name,
    sub: phone,
    icon: 'credits',
    tone: 'gold',
    focus: false,
    build(ui) {
      ui.body.append(h('div', 'hero' + (due > 0 ? '' : ' clear'), glyph('wallet', due > 0 ? 'gold' : '', 'lg'),
        h('div', 'hero-main', h('div', { class: 'foot-label', text: 'Outstanding' }), h('div', { class: 'foot-total', text: money(due), data: { outstanding: '1' } })),
        menu([
          ['Add charge', () => creditEntrySheet(account, false), false, 'plusCircle'],
          ['Adjust balance', () => creditEntrySheet(account, true), false, 'settings'],
          ...(phone ? [['Send on WhatsApp', () => whatsapp(phone, dayStatementText(account)), false, 'whatsapp']] : []),
          [phone ? 'Change mobile' : 'Add mobile', () => creditPhoneSheet(account, false), false, 'user']
        ], 'Account actions')));
      // A bill on this account opens out, in place, to show what it was for.
      const billRow = (billId, title, sub, amount) => {
        const holder = h('div', { class: 'breakdown', hidden: true });
        const row = h('div', { class: 'line pick', role: 'button', tabindex: '0', 'aria-expanded': 'false', data: { breakdown: billId } },
          glyph('bills', '', 'sm'), h('div', 'line-main', h('b', { text: title }), h('span', { class: 'small muted', text: sub })), h('span', { class: 'line-amount', text: amount }), icon('chevron'));
        const toggle = async () => {
          if (!holder.hidden) { holder.hidden = true; row.setAttribute('aria-expanded', 'false'); return; }
          if (!holder.childElementCount) {
            try { billBreakdown(holder, await rpc('rpcBill', token, billId), () => accountSheet(account.id)); }
            catch (e) { sheetStatus('error', e.message); return; }
          }
          holder.hidden = false;
          row.setAttribute('aria-expanded', 'true');
        };
        row.onclick = toggle;
        row.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
        return [row, holder];
      };

      // The account as a statement, oldest first. Every bill or charge stands at the amount that went on credit;
      // every payment is its own line that comes off the total. A payment is never shown as taken off one bill.
      const events = [];
      for (const e of state.CreditEntries.filter(e => e.accountId === account.id)) events.push({ at: e.createdMs, change: e.amountPaise, title: e.label + (e.reason && e.reason !== e.label ? ' · ' + e.reason : ''), who: e.purchaser && e.purchaser !== account.name ? 'for ' + e.purchaser : '', icon: e.amountPaise < 0 ? 'minus' : 'plusCircle' });
      // A bill row is only its number, the time and the amount: whose it was and what for is inside, one tap away.
      for (const t of state.CreditTransfers.filter(t => t.accountId === account.id)) events.push({ at: t.createdMs, change: t.amountPaise, billId: t.billId, title: 'Bill ' + (numberOf(t.billId) || '') });
      for (const r of state.CreditReceipts.filter(r => r.accountId === account.id)) {
        const p = state.Payments.find(p => p.id === r.id);
        if (!p) continue;
        const corrected = state.Corrections.some(c => c.kind === 'payment_reversal' && c.targetId === p.id), how = p.method === 'upi' ? 'UPI' : 'Cash';
        if (p.amountPaise < 0) events.push({ at: p.createdMs, change: -p.amountPaise, title: 'Correction · wrong entry taken back', icon: 'undo' });
        else events.push({ at: p.createdMs, change: -p.amountPaise, title: 'Payment ' + (numberOf(p.id) || '') + ' · ' + how + (corrected ? ' · corrected' : ''), payment: corrected ? null : p, icon: p.method === 'upi' ? 'upi' : 'cash' });
      }
      events.sort((a, b) => a.at - b.at);
      // Everything up to the last time the account stood at nothing is finished business, kept out of the way.
      let running = 0, settledUpTo = -1;
      events.forEach((e, i) => { running += e.change; if (running === 0) settledUpTo = i; });
      const unsettled = events.slice(settledUpTo + 1), earlier = events.slice(0, settledUpTo + 1);
      const statement = list => {
        const card = h('div', 'lines');
        for (const e of list) {

          else card.append(h('div', { class: 'line', data: e.payment ? { payment: e.payment.id } : null }, glyph(e.icon, off ? 'jade' : '', 'sm'),
            h('div', 'line-main', h('b', { text: e.title }), h('span', { class: 'small muted', text: sub })),
            h('span', { class: 'line-amount' + (off ? ' good' : ''), text: money(e.change) }),
            e.payment ? menu([['Correct amount', () => correctPaymentSheet(account, e.payment), false, 'pencil']], 'Payment actions') : null));
        }
        return card;
      };
      if (unsettled.length) ui.body.append(h('div', 'group-title', icon('bills'), 'Bills and payments'), statement(unsettled));
      if (earlier.length) {
        if (showEarlier || !unsettled.length) ui.body.append(h('div', 'group-title', icon('history'), 'Settled earlier'), statement(earlier.slice().reverse()));
        else ui.body.append(h('div', { class: 'station-links', style: 'margin-top:10px' }, btn([icon('history'), 'Show settled earlier'], () => { showEarlier = true; ui.redraw(); }, 'quiet', { data: { action: 'earlier' } })));
      }

function festivalSheet(f) {
  let from, to, onOff;
  openSheet({
    title: f.emoji + ' ' + f.name,
    sub: f.key === 'newyear' ? 'Added to every confirmation on 31 Dec and 1–4 Jan' : 'Asked when a confirmation is sent on these days',
    icon: 'message',
    tone: 'jade',
    build(ui) {
      if (f.key !== 'newyear') {

// Erase all data: the password and the word ERASE; the menu kept unless unticked. Waits for saves still on their way.
function eraseAllSheet() {
  let password, word, keepMenu;
  openSheet({
    title: 'Erase all data',
    sub: 'This cannot be undone from the app',
    icon: 'trash',
    tone: 'bad',
    build(ui) {
      password = password || h('input', { type: 'password', autocomplete: 'current-password', 'aria-label': 'Manager password', data: { field: 'erase-password' } });
      word = word || textInput({ 'aria-label': 'Type ERASE', autocapitalize: 'characters', data: { field: 'erase-word' } });
      keepMenu = keepMenu || h('input', { type: 'checkbox', checked: true, data: { field: 'erase-keep-menu' } });
      const list = (title, items) => h('div', 'field', h('span', { text: title }), h('p', { class: 'small', text: items }));
      ui.body.append(
        list('Erased', 'Every bill, payment and receipt, gaming session, turf booking, reservation, credit account, customer, report day and comment. Bill numbers start again at CA-0001.'),
        list('Kept', 'Stations, gaming and turf rates, settings, festival dates and the sign-in. A private backup copy of everything is made first.'),
        h('label', 'check', keepMenu, h('span', { text: 'Keep the snacks and beverages menu' })),
        field('Manager password', password),
        field('Type ERASE to confirm', word));
      const go = h('button', { type: 'button', class: 'btn danger block', data: { action: 'erase-confirm' } }, icon('trash'), 'Erase everything');
      const ready = () => { go.disabled = word.value.trim() !== 'ERASE' || !password.value; };
      word.oninput = ready;
      password.oninput = ready;
      ready();
      go.onclick = async () => {
        go.disabled = true;
        go.classList.add('loading');
        sheetStatus('pending', 'Making a backup copy, then erasing…');
        try {
          await outboxDrained();
          await rpc('rpcEraseAll', token, password.value, keepMenu.checked, word.value.trim());
          password.value = '';
          closeSheet();
          await refresh(true);
          go2home();
          notify('success', 'Everything is erased. A backup copy was saved first. City Arena starts fresh.');
        } catch (e) {
          password.value = '';
          go.classList.remove('loading');
          sheetStatus('error', e.message + ' Nothing was erased.');
          ready();
        }
      };
      ui.foot.append(go);
      password.focus();
    }
  });
}

// ---------- Turf: two outdoor courts booked by the hour, 6 AM to 10 PM ----------
// The board shows one day: an hour per row and a column per court. A free hour is tapped to book it; a booking is one block.
const TURF_COURTS = ['5-a-side', '6-a-side'];
const TURF_OPEN = 6, TURF_CLOSE = 22;
// Shown on the availability message, as on the old turf app.
const TURF_CONTACT = '+91 9980388444';
let turfDay = '', turfView = 'day', turfCache = { key: '', list: null };

function shiftDay(key, days) { return new Date(Date.parse(key + 'T00:00:00Z') + days * 86400000).toISOString().slice(0, 10); }
function hourLabel(hour) { return (hour % 12 || 12) + (hour < 12 ? ' AM' : ' PM'); }
function hourStart(key, hour) { return Date.parse(key + 'T00:00:00+05:30') + hour * 3600000; }
function turfRange(b) { return hourLabel(Number(b.startHour)) + ' – ' + hourLabel(Number(b.startHour) + Number(b.hours)); }
function turfHours(b) { return Number(b.hours) + (Number(b.hours) === 1 ? ' hour' : ' hours'); }
function turfDayName(key) { return new Date(key + 'T00:00:00+05:30').toLocaleDateString('en-IN', { timeZone: IST, weekday: 'short', day: 'numeric', month: 'short' }); }
function turfDayWord(key) {
  const today = dayKey(nowMs());
  if (key === today) return 'Today';
  if (key === shiftDay(today, 1)) return 'Tomorrow';
  if (key === shiftDay(today, -1)) return 'Yesterday';
  return turfDayName(key);
}
const turfEnded = b => hourStart(b.dateKey, Number(b.startHour) + Number(b.hours)) <= nowMs();
// How a booking stands: from the live snapshot, or as an older day was fetched.
const turfSettled = b => { const known = (state.TurfStatus || []).find(s => s.bookingId === b.id); return known ? known.state : b.settledState || 'open'; };
// Over and settled: it leaves the board for the day's past bookings.
const turfDone = b => turfEnded(b) && turfSettled(b) === 'settled';
const sportIcon = sport => (sport === 'Cricket' ? 'cricket' : 'football');

// Bookings on a day. Yesterday onwards come with the snapshot; an older day is fetched once (null while it loads).
function turfBookingsOn(key) {
  if (key >= shiftDay(dayKey(nowMs()), -1)) return (state.TurfBookings || []).filter(b => b.dateKey === key);
  if (turfCache.key === key + '|' + version) return turfCache.list;
  return null;
}
async function loadTurfDay(key) {
  const cacheKey = key + '|' + version;
  try { turfCache = { key: cacheKey, list: await rpc('rpcTurf', token, key, key) }; }
  catch (e) { turfCache = { key: cacheKey, list: [] }; notify('error', e.message); }
  if (page === 'turf' && turfDay === key) render();
}
function turfBookingOf(id) { return (state.TurfBookings || []).find(b => b.id === id) || (turfCache.list || []).find(b => b.id === id) || null; }
function bookingAt(list, court, hour) { return list.find(b => b.court === court && Number(b.startHour) <= hour && hour < Number(b.startHour) + Number(b.hours)); }
// Start hours still open on a court that day; a booking being changed does not block itself.
function freeStarts(key, court, exceptId) {
  const list = (turfBookingsOn(key) || []).filter(b => b.id !== exceptId), starts = [];
  for (let hour = TURF_OPEN; hour < TURF_CLOSE; hour++) if (!bookingAt(list, court, hour) && hourStart(key, hour + 1) > nowMs()) starts.push(hour);
  return starts;
}
function freeRun(key, court, start, exceptId) {
  const open = freeStarts(key, court, exceptId);
  let hours = 0;
  while (open.includes(start + hours)) hours++;
  return hours;
}

// ---------- WhatsApp: the wording of the old turf app ----------
function ordinalDate(key) {
  const d = new Date(key + 'T00:00:00+05:30'), n = Number(key.slice(8));
  const suffix = n > 3 && n < 21 ? 'th' : ['th', 'st', 'nd', 'rd', 'th', 'th', 'th', 'th', 'th', 'th'][n % 10];
  return n + suffix + ' ' + d.toLocaleDateString('en-IN', { timeZone: IST, month: 'long', year: 'numeric' });
}
function paddedHour(hour) { return String(hour % 12 || 12).padStart(2, '0') + ':00 ' + (hour < 12 ? 'AM' : 'PM'); }
// Each sport its own emoji; any other sport a target. Nothing football-specific is written for another sport.
const SPORT_EMOJI = { Football: '⚽', Cricket: '🏏', Basketball: '🏀', Badminton: '🏸', Volleyball: '🏐', Tennis: '🎾' };
// ---------- Festival wishes, at the end of a booking confirmation ----------
// Diwali, Eid and Christmas: on the dates set in Settings, the confirmation asks whether to add the wishes.
// New Year: added without asking on 31 December (in advance) and from 1 to 4 January, every year.
const FESTIVALS = [
  { key: 'diwali', name: 'Diwali', emoji: '🪔', wishes: ['🪔✨ Happy Diwali! ✨🪔', 'May this Festival of Lights bring happiness, prosperity, and beautiful moments to you and your loved ones. Wishing you a wonderful Diwali filled with joy, warmth, and togetherness! 💛'] },
  { key: 'eid', name: 'Eid Mubarak', emoji: '🌙', wishes: ['🌙✨ Eid Mubarak! ✨🌙', 'Wishing you and your family a blessed Eid filled with peace, happiness, and togetherness. May this beautiful occasion bring countless blessings and joyful memories to your home! 💛'] },
  { key: 'christmas', name: 'Christmas', emoji: '🎄', wishes: ['🎄✨ Merry Christmas! ✨🎄', 'Wishing you and your loved ones a wonderful Christmas filled with love, laughter, and beautiful memories. May the joy and warmth of this festive season bring endless happiness to your home! ❤️'] }
];
const NEW_YEAR = {
  key: 'newyear', name: 'New Year', emoji: '🎊',
  advance: ['🎊✨ Happy New Year in Advance! ✨🎊', 'As we get ready to welcome another year, we’d like to take a moment to thank you for being a part of the City Arena family! 💛', 'Wishing you and your loved ones a wonderful year ahead filled with happiness, good health, success, and countless beautiful memories.', 'Here’s to another year of great games, wonderful friendships, and unforgettable moments together! ⚽🏏'],
  wishes: ['🎊✨ Happy New Year! ✨🎊', 'Wishing you and your loved ones a fantastic year filled with happiness, good health, success, and wonderful memories!', 'Thank you for being such a valued part of City Arena. Your continued love and support mean so much to us! 💛', 'Here’s to another amazing year of great games, good times, and unforgettable moments together! 🙌']
};
// A festival's dates and on/off as saved in Settings; the wording is always the fixed one above.
function festivalSetting(festival) {
  const row = (state.Settings || []).find(r => r.id === 'festival-' + festival.key);
  let saved = {};
  try { saved = row ? JSON.parse(row.value) : {}; } catch (e) { saved = {}; }
  return { ...festival, enabled: festival.key === 'newyear' ? saved.enabled !== false : !!saved.enabled, from: saved.from || '', to: saved.to || '' };
}
// The festivals switched on for today (India date), to offer when a confirmation is sent.
function festivalsToday() {
  const today = dayKey(nowMs());
  return FESTIVALS.map(festivalSetting).filter(f => f.enabled && f.from && f.from <= today && today <= f.to);
}
// New Year's wishes for today, if it is 31 December or 1–4 January.
function newYearWishes() {
  const ny = festivalSetting(NEW_YEAR), monthDay = dayKey(nowMs()).slice(5);
  if (!ny.enabled) return null;
  if (monthDay === '12-31') return ny.advance;
  return monthDay >= '01-01' && monthDay <= '01-04' ? ny.wishes : null;
}
// The confirmation and the cancellation, in the owner's wording, with the greeting of the moment it is sent.
// A confirmation sent with festival wishes (chosen, or New Year's on its days) follows the owner's festive sample.
function turfMessage(b, cancelled, wishes) {
  const start = Number(b.startHour), end = start + Number(b.hours), court = b.court === '5-a-side' ? '5A Side' : '6A Side';
  const lines = [greetingLine(b.customer, nowMs()), ''];
  if (cancelled) lines.push('*Your booking has been successfully cancelled.* ✅', '', 'We’re sorry to miss you this time!', '', '*Cancelled Booking Details*', '');
  else lines.push('*Your booking at City Arena is confirmed!* ✅', '', 'We’re delighted to have you join us. Here are your booking details:', '', '*📋 Booking Details*', '');
  lines.push('📅 *Date:* ' + ordinalDate(b.dateKey), '⏰ *Time:* ' + paddedHour(start) + ' – ' + paddedHour(end), '📍 *Turf:* ' + court, (SPORT_EMOJI[b.sport] || '🎯') + ' *Sport:* ' + b.sport, '');
  if (cancelled) lines.push('We understand that plans can change, and we hope to welcome you back for another game soon!', '', 'Until then, take care and see you next time! 🙌');
  else {
    const festive = wishes || newYearWishes();
    if (festive) lines.push('Kindly inform us in advance in case of any cancellations or changes to your booking.', '', 'We look forward to seeing you on the turf!', '', festive.join('\n\n'));
    else lines.push('We look forward to welcoming you to the turf! 🙌', '', 'If there’s any change in your plans, we kindly request you to inform us in advance.', '', 'Thank you for choosing *City Arena*. See you soon!');
  }
  lines.push('', '*#PlayAtCityArena*', '*Team City Arena*', 'Mangalore');
  return lines.join('\n');
}
// Which hours are still open on each court, for sending to a group.
function turfAvailabilityText(key, list) {
  const d = new Date(key + 'T00:00:00+05:30'), lines = ['*City Arena - Mangalore*', ''];
  lines.push('Slot availability on *' + d.toLocaleDateString('en-IN', { timeZone: IST, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) + '*', '');
  lines.push('*Timings' + ' '.repeat(16) + '6A side | 5A side*', '');
  const short = hour => (hour % 12 || 12) + (hour < 12 ? 'am' : 'pm');
  for (let hour = TURF_OPEN; hour < TURF_CLOSE; hour++) {
    if (hourStart(key, hour + 1) <= nowMs()) continue;
    const mark = court => (bookingAt(list, court, hour) ? '❌' : '✅');
    lines.push((short(hour) + ' - ' + short(hour + 1)).padEnd(25) + mark('6-a-side') + '  |  ' + mark('5-a-side'));
  }
  lines.push('', '✅ : Slot available', '❌ : Not available', '', 'For bookings,', 'Contact 📱: ' + TURF_CONTACT, '', '#playatcityarena');
  return lines.join('\n');
}

// A message as the customer will see it in WhatsApp: *bold* shown bold, the asterisks gone.
function whatsappPreview(text, key) {
  const box = h('div', { class: 'message-preview', data: { field: key } });
  text.split('\n').forEach((line, i) => {
    if (i) box.append('\n');
    line.split(/(\*[^*\n]+\*)/).forEach(part => box.append(/^\*[^*\n]+\*$/.test(part) ? h('b', { text: part.slice(1, -1) }) : part));
  });
  return box;
}
// WhatsApp opens on the tap itself; marking it sent is saved after, once. During Diwali, Eid or Christmas a small
// sheet asks first whether to add the wishes, with the message to be sent shown below.
function turfSendConfirmation(b, then) {
  const send = wishes => {
    whatsapp(b.phone, turfMessage(b, false, wishes));
    if (b.confirmSent !== 'yes') runCommand({ type: 'TURF_SENT', id: b.id, revision: b.revision }, then);
  };
  const festivals = festivalsToday();
  if (!festivals.length) { send(null); return; }
  festivalChoiceSheet(b, festivals, then, send);
}
function festivalChoiceSheet(b, festivals, then, send) {

    focus: false,
    build(ui) {

        choice = choice || segmented(festivals.map(f => [f.key, f.emoji + ' ' + f.name]), chosen.key, key => { chosen = festivals.find(f => f.key === key); ui.redraw(); });
        ui.body.append(h('div', { class: 'field', data: { field: 'festival-choice' } }, h('span', { text: 'Which wishes?' }), choice.node));

    '📅 *Date:* ' + (key === today ? 'Today' : key === tomorrow ? 'Tomorrow' : turfDayName(key)),
    '⏰ *Time:* ' + paddedHour(start) + ' – ' + paddedHour(start + hours),
    '🟩 *Turf:* ' + (court === '5-a-side' ? '5A Side' : '6A Side'), '',

// ---------- Saving in the background ----------
// A save shows on screen at once. The same rule engines the server runs work it out here, on the screen's copy of the
// data and with the same request ID, so every number and record they make is the one the server will make. The request
// then goes to the server in the background, one at a time and in order, and keeps its ID until the server answers, so
// it can never be saved twice. Until then the top of the screen says "Saving…". A save the server refuses comes back off
// the screen with the reason. The server always has the last word: the screen is the server's data with the saves still
// on their way laid over it.
const OUTBOX_KEY = 'arenaOutbox';
let outbox = [], confirmed = null, confirmedVersion = '', outboxBusy = false, outboxTrouble = '', outboxWaiters = [];

catch (e) { outbox = []; }
function keepOutbox() {
  try { if (storage) storage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); } catch (e) { /* the save is still on its way */ }
}
const engineActor = () => ({ role: 'owner', username: session && session.user ? session.user.username : '' });
// One save worked out on a copy of the screen's data: the data afterwards (as the server would show it) and the result.
function predict(view, item) {
  const copy = structuredClone(view);
  const result = ArenaCore.run(copy, item.command, engineActor(), item.at, item.id);
  return { view: ArenaViews.snapshot(copy, item.at), result };
}
// The server's data with the saves still on their way laid over it. One the server already holds is not laid twice;
// one that no longer fits is left off the screen and the server answers for it.
function overlay(base) {
  const applied = new Set(base.Applied || []);
  let view = base;
  for (const item of outbox) {
    if (applied.has(item.id)) continue;
    try { view = predict(view, item).view; } catch (e) { /* the server decides */ }
  }
  return view;
}
const versionTime = v => Number(String(v || '0').split('-')[0]) || 0;
// The server's data arrived (a refresh or a save's answer). An answer older than one already shown is ignored.
function setConfirmed(serverState, serverVersion) {

  confirmed = serverState;
  confirmedVersion = serverVersion;
  version = serverVersion;
  state = outbox.length ? overlay(serverState) : serverState;
  return true;
}
// A save tried on screen first. The screen's result; a refusal the rules gave at once; or null when the screen does
// not hold what the save needs and the server must decide.
function trySaveHere(command) {
  if (!confirmed || !state || typeof ArenaCore === 'undefined') return null;
  const item = { id: crypto.randomUUID(), command, at: nowMs() };
  let out;
  try { out = predict(state, item); }
  catch (e) {
    if (e.userFacing && e.message !== 'Record not found.') return { refused: e.message };
    return null;
  }
  outbox.push(item);
  keepOutbox();
  state = out.view;
  showSync(true, lastGood);
  pumpOutbox();
  return { result: out.result, command };
}
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
async function pumpOutbox() {
  if (outboxBusy || !token) return;
  outboxBusy = true;
  let wait = 2000;
  try {
    while (outbox.length && token) {
      const item = outbox[0];
      let reply;
      try { reply = await rpc('rpcCommand', token, { id: item.id, command: item.command }); }
      catch (e) {
        if (e.notSaved) {
          // Refused for good: off the screen, with the reason.
          outbox.shift();
          keepOutbox();
          outboxTrouble = '';
          notify('error', e.message + ' That change was taken back; nothing was saved.');
          await refresh(true);
          continue;
        }
        // No answer: the same request again, a little later. It is never entered twice.
        outboxTrouble = /sign in|expired|Access denied/i.test(e.message) ? 'Sign in again to finish saving.' : 'Not saved yet · retrying';
        showSync(true, lastGood);
        if (outboxTrouble.startsWith('Sign in')) break;
        await pause(wait);
        wait = Math.min(wait * 2, 30000);
        continue;
      }
      wait = 2000;
      outboxTrouble = '';
      outbox.shift();
      keepOutbox();
      if (reply.snapshot) {
        clockOffset = reply.snapshot.serverMs - Date.now();
        lastGood = reply.snapshot.serverMs;
        const before = JSON.stringify(state);
        setConfirmed(reply.snapshot.state, reply.snapshot.version);
        if (JSON.stringify(state) !== before) render();
      } else await refresh(true);
    }
  } finally {
    outboxBusy = false;
    showSync(true, lastGood);

// them yet); otherwise from the server.
function viewHere(read) {

  try { return structuredClone(read(state)); } catch (e) { return null; }
}

// ---------- Session ----------
function signedOut(message) {
  token = '';
  version = '';
  state = null;
  // The next sign-in starts on the Gaming floor.
  page = 'floor';
  floorCategory = null;
  if (storage) storage.removeItem('arenaToken');

  $('login').hidden = false;
  $('loginError').textContent = message || '';
}
async function signOut() {
  if (flow.saving()) return;
  if (outbox.length) { notify('pending', 'Still saving. Sign out in a moment, once it says Up to date.'); return; }
  try { await rpc('rpcLogout', token); } catch (e) { /* signing out locally is still right */ }
  signedOut('');
}
function showSync(ok, at) {

  $('sync').classList.toggle('stale', !ok || !!trouble);
  $('sync').classList.toggle('saving', !!saving && !trouble);
  $('syncText').textContent = trouble ? outboxTrouble : saving ? 'Saving…' : ok ? 'Up to date' : 'Not updated since ' + clock(at);
  $('sync').title = saving ? 'Changes are on screen; the server is confirming them' : ok ? 'Up to date at ' + clock(at) : 'The last refresh failed';

// ---------- Refresh: the server answers "unchanged" cheaply, so the screen is only redrawn for real changes ----------
let refreshing = null, lastGood = Date.now();
// The last data this device had from the server. A device still signed in opens on it at once, marked "Not updated
// since …" until the server answers. Gone at sign-out.
const LAST_KEY = 'arenaLast';
function keepLast(data) {
  try { if (storage && token) storage.setItem(LAST_KEY, JSON.stringify({ state: confirmed, serverMs: data.serverMs, user: session.user })); } catch (e) { /* only a convenience */ }
}

  try { const last = JSON.parse(storage.getItem(LAST_KEY) || 'null'); return last && last.state && last.user ? last : null; } catch (e) { return null; }
}
function forgetLast() {
  try { if (storage) storage.removeItem(LAST_KEY); } catch (e) { /* nothing kept */ }
}
function showApp(user) {
  $('login').hidden = true;
  $('app').hidden = false;
  $('identity').textContent = user.username;
  $('avatar').textContent = (user.username[0] || '?').toUpperCase();
}
function openOnLast(last) {

  showApp(last.user);
  showSync(false, last.serverMs);

}
// The server's data on screen: from a refresh, or straight from the sign-in.
function applySnapshot(data) {
  clockOffset = data.serverMs - Date.now();
  lastGood = data.serverMs;
  session = { user: data.user, lastBackup: data.lastBackup, backupError: data.backupError };
  const first = !state;
  if (!data.unchanged && setConfirmed(data.state, data.version)) keepLast(data);
  // Saves left on their way (a reload, a lost connection) carry on.
  if (outbox.length && !outboxBusy) pumpOutbox();
  showApp(data.user);
  showSync(true, data.serverMs);

}

  clockOffset = snapshot.serverMs - Date.now();

    } catch (e) {

  })();

}

// Signed in for as long as the app is open (on screen or behind another tab). Closed for over an hour (the tab or the
// browser shut, the computer asleep): the password again. Every open tab of the app keeps the others alive.
const AWAY_LIMIT_MS = 3600000, ALIVE_KEY = 'arenaAlive';

}

}

  signedOut('Signed out after more than an hour away. Sign in again.');
}
// Back on the app after a while (the computer woke up, the tab was brought back).
const comeBack = () => { if (!token) return; if (awayTooLong()) signOutAfterAway(); else { markAlive(); refresh(); } };
window.addEventListener('focus', comeBack);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') comeBack(); });
setInterval(() => { if (token && !awayTooLong()) markAlive(); }, 60000);
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 15000);
setInterval(tick, 1000);

// On City Arena's own address the connection is opened at once, so it is ready by the time the password is typed.

// There the page is also kept on the device (sw.js), so the next opening does not wait for GitHub.
if (typeof google === 'undefined' && window.isSecureContext && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { /* opens from the network as before */ });
if (!storage) { $('login').hidden = false; $('loginError').textContent = 'Browser storage is blocked. Allow site storage to sign in.'; }
